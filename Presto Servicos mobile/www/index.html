<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f5f3">
<title>Prestô — serviços de confiança</title>
<style>
:root{--bg:#f1f4f2;--card:#fff;--ink:#0c2a29;--mut:#76908d;--line:#e2e9e6;--ac:#00a88a;--ac2:#008f75;--soft:#d9f2ec;--sun:#ffb547;--rose:#ff6f7d;--blue:#4f7cff;--r:26px;--shadow:0 1px 0 rgba(12,42,41,.04),0 16px 34px -22px rgba(12,42,41,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI Variable","Segoe UI",system-ui,Roboto,sans-serif;overscroll-behavior:none}
body{font-size:15px;line-height:1.42;overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}input,textarea,select{font:inherit;color:var(--ink)}p{margin:0}h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.1}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;overflow-y:auto;padding:18px 18px 120px}.screen::-webkit-scrollbar{display:none}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:26px;font-weight:800;letter-spacing:-.06em}.logo i{font-style:normal;color:var(--ac)}
.pill-sw{display:flex;background:var(--card);border-radius:99px;padding:4px;box-shadow:var(--shadow);font-size:13px}.pill-sw button{padding:7px 14px;border-radius:99px;font-weight:600;color:var(--mut)}.pill-sw button.on{background:var(--ink);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;width:100%}.btn:active{transform:scale(.98)}.btn.ac{background:var(--ac)}.btn.w{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}.btn.sm{height:40px;width:auto;padding:0 18px;font-size:13.5px}.btn:disabled{opacity:.35}
.ib{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}.ib svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.search{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:99px;padding:0 8px 0 20px;height:58px;box-shadow:var(--shadow);margin-bottom:22px}.search input{flex:1;border:0;outline:0;background:none;font-size:16px}.search .go{width:42px;height:42px;border-radius:50%;background:var(--ac);display:grid;place-items:center}.search .go svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{text-align:center}.cat .ic{aspect-ratio:1;border-radius:24px;display:grid;place-items:center;margin-bottom:7px}.cat .ic svg{width:34px;height:34px}.cat span{font-size:12px;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 14px}.sec h2{font-size:22px}.sec a{font-size:13px;font-weight:700;color:var(--ac2);text-decoration:none}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:0 18px 8px}.hs::-webkit-scrollbar{display:none}
.pc{flex:none;width:230px;background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}.pc .im{height:150px;position:relative}.pc .bd{padding:14px}
.fav{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}.fav svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2}.fav.on svg{fill:var(--rose);stroke:var(--rose)}
.rate{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px}.rate i{color:var(--sun);font-style:normal}
.vf{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ac2);background:var(--soft);padding:3px 9px;border-radius:99px}
.lst{display:flex;gap:14px;background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}.lst .im{width:104px;height:104px;border-radius:20px;flex:none;position:relative;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px}.chips::-webkit-scrollbar{display:none}.chip{flex:none;padding:10px 16px;border-radius:99px;background:var(--card);font-weight:600;font-size:13.5px;box-shadow:var(--shadow)}.chip.on{background:var(--ink);color:#fff}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.hero{height:260px;margin:-18px -18px 0;position:relative}.hero .ib{position:absolute;top:18px}
.sheetp{margin-top:-36px;background:var(--bg);border-radius:32px 32px 0 0;padding:24px 0 0;position:relative}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat3 div{background:var(--card);border-radius:20px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}.stat3 b{display:block;font-size:19px;letter-spacing:-.03em}.stat3 span{font-size:11.5px;color:var(--mut)}
.svc{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.svc:first-of-type{border:0}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--card);border:2px solid transparent;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}.opt.on{border-color:var(--ac);background:#f6fcfa}.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}.opt.on .rd{border-color:var(--ac)}.opt.on .rd:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ac)}
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px}.days::-webkit-scrollbar{display:none}.dy{flex:none;width:62px;padding:12px 0;border-radius:20px;background:var(--card);text-align:center;box-shadow:var(--shadow)}.dy small{display:block;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase}.dy b{font-size:20px;letter-spacing:-.03em}.dy.on{background:var(--ink);color:#fff}.dy.on small{color:#9fc9c3}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sl{padding:13px 0;border-radius:16px;background:var(--card);text-align:center;font-weight:600;box-shadow:var(--shadow)}.sl.on{background:var(--ac);color:#fff}.sl:disabled{opacity:.3;text-decoration:line-through}
.ln{display:flex;justify-content:space-between;padding:6px 0;color:var(--mut)}.ln.t{border-top:1px dashed var(--line);margin-top:8px;padding-top:14px;color:var(--ink);font-weight:800;font-size:19px}
.field{display:block;margin-bottom:14px}.field span{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px;padding-left:4px}.field input,.field textarea,.field select{width:100%;height:54px;border-radius:20px;border:0;background:var(--card);padding:0 18px;outline:0;box-shadow:var(--shadow);font-size:16px}.field textarea{height:90px;padding:14px 18px}
.tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:490px;display:flex;background:var(--ink);border-radius:99px;padding:8px;z-index:20;box-shadow:0 18px 40px -12px rgba(12,42,41,.6)}.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#7f9f9b;text-decoration:none;padding:7px 0;border-radius:99px;font-weight:600}.tabs a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tabs a.on{background:var(--ac);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(12,42,41,.5);z-index:50;display:flex;align-items:flex-end;max-width:520px;margin:auto}.sheet .in{width:100%;background:var(--bg);border-radius:32px 32px 0 0;padding:12px 20px 28px;max-height:90%;overflow:auto}.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;z-index:90}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700}.st.a{background:var(--soft);color:var(--ac2)}.st.b{background:#e4ecff;color:#3358c7}.st.c{background:#ffefd5;color:#9a6200}.st.d{background:#ffe3e6;color:#c23b4b}
.tl div{position:relative;padding:0 0 18px 30px}.tl div:before{content:"";position:absolute;left:8px;top:20px;bottom:-4px;width:2px;background:var(--line)}.tl div:last-child:before{display:none}.tl i{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff}.tl .d i{background:var(--ac);border-color:var(--ac)}.tl .d:before{background:var(--ac)}.tl .c i{border-color:var(--ac);box-shadow:0 0 0 5px var(--soft)}
.ch{max-width:80%;padding:12px 16px;border-radius:22px;margin-bottom:8px}.ch.me{background:var(--ac);color:#fff;margin-left:auto;border-bottom-right-radius:6px}.ch.he{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);font-weight:600}.bars i{display:block;border-radius:12px;background:var(--soft);margin-bottom:6px}.bars i.hi{background:var(--ac)}
.stars{display:flex;gap:6px;justify-content:center;font-size:42px}.stars button{color:#dfe7e4}.stars button.on{color:var(--sun)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const $app = document.getElementById('app');
const R = (n) => 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const CATS = [['Limpeza', '#d9f2ec', '#00a88a', 'M4 20l4-4M7 13l4 4 9-9-4-4zM14 6l4 4'], ['Reparos', '#ffefd5', '#e08a00', 'M14 7a4 4 0 0 1 5 5L9 22l-4-4L15 8zM8 14l2 2'], ['Elétrica', '#fff3c9', '#d6a000', 'M13 2L4 14h7l-1 8 9-12h-7z'], ['Hidráulica', '#e4ecff', '#4f7cff', 'M12 3s6 6.500 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z'], ['Pintura', '#ffe3e6', '#e0485c', 'M4 4h13v6H4zM17 7h3v6h-8v3M10 16h4v5h-4z'], ['Aulas', '#ece3ff', '#7a4fe0', 'M3 9l9-5 9 5-9 5zM7 12v5c3 2 7 2 10 0v-5'], ['Beleza', '#ffe3f1', '#d63d8f', 'M12 3l2.200 5.800L20 11l-5.800 2.200L12 19l-2.200-5.800L4 11l5.800-2.200z'], ['Pets', '#e1f5e4', '#2f9d4a', 'M7 10a2 2 0 1 0 0-.1M17 10a2 2 0 1 0 0-.1M10 6a2 2 0 1 0 0-.1M14 6a2 2 0 1 0 0-.1M12 12c-3 0-5 3-5 5s2 2 5 2 5 0 5-2-2-5-5-5z']];
const PROS = [
  [1, 'Helena Rocha', 0, 'Faxina residencial e pós-obra', 4.96, 312, 55, 1.2, true, 'Trabalho com limpeza há 9 anos, atendo apartamentos, casas e escritórios. Levo produtos e equipamentos próprios e sigo checklist por ambiente.', [['Faxina padrão (4 h)', 220], ['Faxina pesada / pós-obra', 380], ['Passar roupa (3 h)', 120]], 'Moema'],
  [2, 'Carlos Menezes', 1, 'Eletricista residencial e comercial', 4.92, 548, 90, 2.4, true, 'Eletricista com NR-10, instalação de chuveiros, tomadas, quadros e iluminação. Orçamento transparente e garantia de 90 dias.', [['Visita técnica + diagnóstico', 80], ['Instalação de chuveiro', 160], ['Troca de disjuntores', 140], ['Instalação de lustre', 120]], 'Vila Mariana'],
  [3, 'Aline Barbosa', 6, 'Cabeleireira e manicure a domicílio', 4.98, 421, 120, 3.1, true, 'Atendimento no conforto da sua casa, com kit próprio esterilizado. Cortes, escova, coloração e unhas em gel.', [['Corte + escova', 140], ['Manicure e pedicure', 90], ['Coloração completa', 260]], 'Pinheiros'],
  [4, 'Rafael Duarte', 3, 'Encanador 24 horas', 4.88, 267, 85, 1.8, true, 'Vazamentos, desentupimento, troca de torneiras e caixa d’água. Atendimento rápido e peças com nota fiscal.', [['Visita técnica', 70], ['Desentupimento', 180], ['Troca de torneira/registro', 110]], 'Ipiranga'],
  [5, 'Patrícia Lima', 5, 'Professora de inglês e reforço escolar', 4.99, 189, 80, 0.9, true, 'Professora com 11 anos de experiência, aulas particulares de inglês para crianças e adultos, presenciais ou online.', [['Aula de inglês (1 h)', 80], ['Pacote 8 aulas', 560], ['Reforço escolar (1 h)', 70]], 'Vila Madalena'],
  [6, 'Bruno Tavares', 4, 'Pintor residencial', 4.85, 203, 75, 4.2, false, 'Pintura interna e externa, textura e grafiato. Acabamento fino e proteção total dos móveis.', [['Pintura de quarto (até 15 m²)', 480], ['Pintura de sala (até 30 m²)', 890], ['Textura em parede', 650]], 'Tatuapé'],
  [7, 'Juliana Prado', 7, 'Passeadora e pet sitter', 4.97, 356, 45, 1.5, true, 'Passeios individuais, visitas diárias e hospedagem em casa para cães e gatos. Fotos e vídeos a cada passeio.', [['Passeio individual (45 min)', 45], ['Visita pet sitter (30 min)', 40], ['Hospedagem (diária)', 90]], 'Perdizes'],
  [8, 'Marcos Valente', 1, 'Montagem de móveis e pequenos reparos', 4.9, 477, 70, 2.9, true, 'Montagem de guarda-roupas, cozinhas planejadas e prateleiras, instalação de TV e cortinas.', [['Montagem de guarda-roupa', 190], ['Instalação de TV na parede', 130], ['Pacote reparos (2 h)', 150]], 'Santana'],
];
const pBy = Object.fromEntries(PROS.map((p) => [p[0], p]));
const REV = [['Camila A.', 5, 'Pontual, caprichosa e super educada. Já agendei de novo para o mês que vem.', 'há 3 dias'], ['Roberto S.', 5, 'Serviço impecável, explicou tudo e deixou a casa limpa. Recomendo muito.', 'há 1 semana'], ['Fernanda L.', 4, 'Ótimo trabalho, só atrasou 10 minutos mas avisou antes.', 'há 2 semanas']];
const IC = { home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>', chat: '<path d="M21 12a8 8 0 0 1-11.500 7.200L4 20l1-4.500A8 8 0 1 1 21 12z"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>', back: '<path d="M15 5l-7 7 7 7"/>', heart: '<path d="M12 20s-7-4.600-7-10a4 4 0 0 1 7-2.600A4 4 0 0 1 19 10c0 5.400-7 10-7 10z"/>', filt: '<path d="M4 6h16M7 12h10M10 18h4"/>', wal: '<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h12M16 14h3"/>', chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>' };
const ic = (n) => `<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
const back = `<a class="ib" href="javascript:history.back()">${ic('back')}</a>`;
/* arte procedural por categoria: formas suaves, sem emoji */
function art(c, seed = 0, h = 150) {
  const [, soft, strong] = CATS[c]; let x = (seed * 7919 + c * 104729) % 9973; const r = () => ((x = (x * 9301 + 49297) % 233280) / 233280);
  let s = ''; for (let i = 0; i < 6; i++) s += `<circle cx="${(r() * 320).toFixed(0)}" cy="${(r() * h).toFixed(0)}" r="${(30 + r() * 70).toFixed(0)}" fill="${strong}" opacity="${(0.08 + r() * 0.18).toFixed(2)}"/>`;
  return `<svg viewBox="0 0 320 ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="320" height="${h}" fill="${soft}"/>${s}<g transform="translate(${160 - 28} ${h / 2 - 28}) scale(2.3)" fill="none" stroke="${strong}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"><path d="${CATS[c][3]}"/></g></svg>`;
}
const avatar = (p, s = 48) => `<div class="av" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,${CATS[p[2]][2]},${CATS[(p[2] + 3) % 8][2]});font-size:${s * .38}px">${p[1].split(' ').map((w) => w[0]).join('')}</div>`;
const rate = (p) => `<span class="rate"><i>★</i>${p[4].toFixed(2).replace('.', ',')} <span class="mut" style="font-weight:500">(${p[5]})</span></span>`;

let S; try { S = JSON.parse(localStorage.getItem('presto.v1')); } catch (e) { S = null; }
if (!S) S = { setup: false, mode: 'cli', name: '', addr: 'Rua Oscar Freire, 512 — Pinheiros', fav: [], bookings: [], wallet: 80, nid: 7000, f: { cat: -1, max: 300, rating: 0, ver: false, sort: 'rel' }, q: '' };
const save = () => { try { localStorage.setItem('presto.v1', JSON.stringify(S)); } catch (e) {} };
const toast = (t) => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1900); };
const dk = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const fdate = (k) => { const d = new Date(k + 'T12:00'); return `${WD[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; };
const FEE = 0.12;
const tabs = (c) => { const L = S.mode === 'cli' ? [['inicio', 'Início', 'home'], ['buscar', 'Buscar', 'search'], ['reservas', 'Reservas', 'cal'], ['mensagens', 'Chat', 'chat'], ['conta', 'Conta', 'user']] : [['painel', 'Painel', 'home'], ['solicitacoes', 'Pedidos', 'bell'], ['agenda', 'Agenda', 'cal'], ['ganhos', 'Ganhos', 'chart'], ['conta', 'Perfil', 'user']]; return `<nav class="tabs">${L.map(([k, l, i]) => `<a href="#/${k}" class="${c === k ? 'on' : ''}">${ic(i)}${l}</a>`).join('')}</nav>`; };
const head = () => `<div class="hd"><div class="logo">prestô<i>.</i></div><div class="pill-sw"><button class="${S.mode === 'cli' ? 'on' : ''}" data-act="mode" data-v="cli">Preciso</button><button class="${S.mode === 'pro' ? 'on' : ''}" data-act="mode" data-v="pro">Ofereço</button></div></div>`;
const proCard = (p) => `<div class="pc" data-go="#/prestador/${p[0]}"><div class="im">${art(p[2], p[0], 150)}<button class="fav ${S.fav.includes(p[0]) ? 'on' : ''}" data-act="fav" data-v="${p[0]}"><svg viewBox="0 0 24 24">${IC.heart}</svg></button></div><div class="bd"><div class="row sp"><b>${p[1]}</b>${p[8] ? '<span class="vf">✓</span>' : ''}</div><p class="mut sm" style="margin:2px 0 8px">${p[3]}</p><div class="row sp">${rate(p)}<b>${R(p[6])}<span class="mut sm" style="font-weight:500">/h</span></b></div></div></div>`;
const lstCard = (p) => `<div class="lst" data-go="#/prestador/${p[0]}"><div class="im">${art(p[2], p[0], 104)}</div><div class="grow"><div class="row sp"><b style="font-size:16px">${p[1]}</b><button data-act="fav" data-v="${p[0]}" style="color:${S.fav.includes(p[0]) ? 'var(--rose)' : '#c8d4d1'};font-size:20px">♥</button></div><p class="mut sm" style="margin:2px 0 6px">${p[3]}</p><div class="row" style="gap:8px">${rate(p)}${p[8] ? '<span class="vf">✓ verificado</span>' : ''}</div><div class="row sp" style="margin-top:8px"><span class="mut sm">${p[7].toString().replace('.', ',')} km • ${p[11]}</span><b>${R(p[6])}/h</b></div></div></div>`;

const REQS = [[1, 'Camila Andrade', 'Faxina pesada / pós-obra', 'qui, 05/11', '09:00', 380, 'Vila Olímpia • 3,2 km', 'Apartamento de 70 m², obra recém-finalizada. Há resíduos de tinta nos pisos.'], [2, 'Roberto Salgado', 'Faxina padrão (4 h)', 'sex, 06/11', '14:00', 220, 'Itaim Bibi • 4,8 km', 'Casa com 2 quartos e quintal.'], [3, 'Fernanda Luz', 'Passar roupa (3 h)', 'sáb, 07/11', '10:00', 120, 'Moema • 1,9 km', 'Cerca de 40 peças.']];
V.painel = () => `<div class="screen">${head()}<p class="mut">Olá, ${S.name.split(' ')[0] || 'Helena'}</p><h1 style="font-size:30px;margin:4px 0 18px">Seu dia, organizado.</h1><div class="card" style="background:linear-gradient(120deg,var(--ink),#13514c);color:#fff"><p class="sm" style="opacity:.75">Ganhos de outubro</p><div style="font-size:36px;font-weight:800;letter-spacing:-.04em;margin:4px 0 6px">R$ 4.870,00</div><p class="sm" style="color:#7dd3c2">▲ 18% em relação a setembro</p></div>
  <div class="stat3"><div><b>3</b><span>pedidos novos</span></div><div><b>4,96</b><span>sua nota</span></div><div><b>98%</b><span>aceitação</span></div></div><div class="sec" style="margin-top:6px"><h2>Novas solicitações</h2><a href="#/solicitacoes">Ver todas</a></div>${REQS.slice(0, 2).map((r) => `<div class="card" data-go="#/solicitacao/${r[0]}"><div class="row sp"><b>${r[2]}</b><b style="color:var(--ac2)">${R(r[5])}</b></div><p class="mut sm" style="margin:4px 0 12px">${r[1]} • ${r[3]} às ${r[4]}</p><div class="row"><span class="st c">Aguardando você</span><span class="mut sm">${r[6].split(' • ')[1]}</span></div></div>`).join('')}<div class="sec"><h2>Hoje</h2></div><div class="card row"><div style="width:54px;text-align:center"><b style="font-size:20px">14:00</b></div><div class="grow"><b>Faxina padrão (4 h)</b><p class="mut sm">Patrícia Lemos • Pinheiros</p></div><span class="st b">Confirmada</span></div></div>${tabs('painel')}`;
V.solicitacoes = () => `<div class="screen">${head()}<h1 style="font-size:30px;margin-bottom:16px">Solicitações</h1>${REQS.map((r) => `<div class="card" data-go="#/solicitacao/${r[0]}"><div class="row sp"><b style="font-size:16px">${r[2]}</b><b style="color:var(--ac2)">${R(r[5])}</b></div><p class="mut sm" style="margin:4px 0 8px">${r[1]} • ${r[3]} às ${r[4]}</p><p class="sm" style="color:#3b5553">${r[7]}</p><div class="row" style="margin-top:12px"><button class="btn sm ac" data-act="aceitar" data-v="${r[0]}">Aceitar</button><button class="btn sm w">Recusar</button><span class="mut sm" style="margin-left:auto">${r[6].split(' • ')[1]}</span></div></div>`).join('')}</div>${tabs('solicitacoes')}`;
V.solicitacao = (id) => { const r = REQS.find((x) => x[0] === +id); if (!r) return V.solicitacoes(); return `<div class="screen"><div class="hd">${back}<h2>Solicitação</h2><span class="st c">Nova</span></div><div class="card row"><div class="av" style="width:56px;height:56px;background:${CATS[r[0]][2]};font-size:20px">${r[1][0]}</div><div class="grow"><b style="font-size:17px">${r[1]}</b><p class="mut sm">Cliente desde 2025 • <span style="color:var(--sun)">★</span> 4,9</p></div><button class="ib" data-go="#/chat/1">${ic('chat')}</button></div><div class="card"><div class="ln"><span>Serviço</span><b style="color:var(--ink);text-align:right;max-width:60%">${r[2]}</b></div><div class="ln"><span>Quando</span><b style="color:var(--ink)">${r[3]} às ${r[4]}</b></div><div class="ln"><span>Local</span><b style="color:var(--ink)">${r[6]}</b></div><div class="ln"><span>Você recebe</span><b style="color:var(--ac2)">${R(r[5] * 0.88)}</b></div><p class="sm" style="margin-top:10px;padding:12px;background:var(--bg);border-radius:16px">“${r[7]}”</p></div><div class="card" style="height:150px;padding:0;overflow:hidden"><svg viewBox="0 0 360 150" width="100%" height="100%"><rect width="360" height="150" fill="#e6efec"/><path d="M0 40H360M0 95H360M70 0V150M170 0V150M270 0V150" stroke="#fff" stroke-width="9"/><path d="M0 120L360 30" stroke="#fff" stroke-width="5"/><g transform="translate(200 78)"><path d="M0 22C-14 4-14-16 0-16s14 20 0 38z" fill="#00a88a"/><circle cy="-6" r="5" fill="#fff"/></g></svg></div><div class="row"><button class="btn w" style="color:var(--rose)">Recusar</button><button class="btn ac" data-act="aceitar" data-v="${r[0]}">Aceitar pedido</button></div></div>`; };
V.agenda = () => { const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; }); const d0 = V._ad ?? 0;
  return `<div class="screen">${head()}<h1 style="font-size:30px;margin-bottom:16px">Agenda</h1><div class="days">${days.map((d, i) => `<button class="dy ${d0 === i ? 'on' : ''}" data-act="ad" data-v="${i}"><small>${WD[d.getDay()]}</small><b>${d.getDate()}</b></button>`).join('')}</div>${[['08:00', 'Disponível', null], ['09:00', 'Faxina padrão (4 h)', 'Camila Andrade • Vila Olímpia'], ['13:00', 'Disponível', null], ['14:00', 'Passar roupa (3 h)', 'Fernanda Luz • Moema'], ['17:00', 'Bloqueado', null]].map(([h, t, w]) => `<div class="row" style="margin-bottom:10px;gap:14px"><b style="width:48px;color:var(--mut)">${h}</b><div class="grow card" style="margin:0;padding:14px;${w ? 'border-left:5px solid var(--ac)' : 'background:transparent;box-shadow:none;border:1.5px dashed var(--line)'}">${w ? `<b>${t}</b><p class="mut sm">${w}</p>` : `<span class="mut">${t}</span>`}</div></div>`).join('')}</div>${tabs('agenda')}`; };
V.ganhos = () => { const v = [320, 540, 410, 780, 650, 940, 1230]; const mx = Math.max(...v);
  return `<div class="screen">${head()}<h1 style="font-size:30px;margin-bottom:16px">Ganhos</h1><div class="card"><p class="mut sm">Disponível para saque</p><div style="font-size:36px;font-weight:800;letter-spacing:-.04em;margin:2px 0 12px">R$ 1.386,40</div><button class="btn ac" data-act="saque">Sacar via Pix</button></div><div class="card"><p class="mut sm" style="margin-bottom:12px">Últimas 7 semanas</p><div class="bars">${v.map((x, i) => `<div><i class="${i === 6 ? 'hi' : ''}" style="height:${x / mx * 90}px"></i>S${i + 1}</div>`).join('')}</div></div><div class="sec" style="margin-top:6px"><h2>Pagamentos recebidos</h2></div>${[['Faxina padrão (4 h)', 'Patrícia Lemos', 220], ['Faxina pesada / pós-obra', 'Carlos Henrique', 380], ['Passar roupa (3 h)', 'Ana Beatriz', 120]].map(([s, c, v]) => `<div class="card row" style="padding:14px"><div class="grow"><b>${s}</b><p class="mut sm">${c} • taxa 12% descontada</p></div><b style="color:var(--ac2)">+ ${R(v * 0.88)}</b></div>`).join('')}</div>${tabs('ganhos')}`; };
V.perfilpro = () => `<div class="screen">${head()}<div class="row" style="margin-bottom:20px">${avatar(PROS[0], 72)}<div><h2 style="font-size:24px">${S.name || 'Helena Rocha'}</h2><p class="mut">Faxina residencial e pós-obra</p><span class="vf" style="margin-top:6px">✓ Verificada</span></div></div><div class="stat3"><div><b>4,96</b><span>312 avaliações</span></div><div><b>436</b><span>serviços</span></div><div><b>2 anos</b><span>no Prestô</span></div></div><h3 style="margin:8px 0 8px">Meus serviços</h3><div class="card" style="padding:6px 18px">${PROS[0][10].map((s) => `<div class="svc"><div class="grow"><b>${s[0]}</b></div><b>${R(s[1])}</b></div>`).join('')}</div><button class="btn w" data-act="reset" style="color:var(--rose)">Sair e apagar dados</button></div>${tabs('conta')}`;

/* ---------- ações ---------- */
function filtros() {
  const el = document.createElement('div'); el.className = 'sheet'; const f = { ...S.f };
  const paint = () => { el.innerHTML = `<div class="in"><div class="grab"></div><div class="row sp" style="margin-bottom:18px"><h2>Filtros</h2><button data-x class="mut" style="font-size:24px">×</button></div><p class="b" style="margin-bottom:8px">Ordenar por</p><div class="chips" style="flex-wrap:wrap;margin:0 0 18px;overflow:visible">${[['rel', 'Relevância'], ['nota', 'Melhor nota'], ['preco', 'Menor preço'], ['dist', 'Mais perto']].map(([k, l]) => `<button class="chip ${f.sort === k ? 'on' : ''}" data-s="${k}">${l}</button>`).join('')}</div><p class="b" style="margin-bottom:4px">Preço máximo por hora: <span style="color:var(--ac2)">${R(f.max)}</span></p><input type="range" id="fm" min="40" max="300" step="5" value="${f.max}" style="width:100%;accent-color:#00a88a;margin-bottom:18px"><p class="b" style="margin-bottom:8px">Nota mínima</p><div class="chips" style="margin:0 0 18px">${[0, 4, 4.5, 4.8].map((v) => `<button class="chip ${f.rating === v ? 'on' : ''}" data-r="${v}">${v ? '★ ' + v.toString().replace('.', ',') + '+' : 'Qualquer'}</button>`).join('')}</div><button class="opt ${f.ver ? 'on' : ''}" data-v><span class="rd"></span><span class="grow b" style="font-weight:600">Somente profissionais verificados</span></button><div class="row" style="margin-top:8px"><button class="btn w" data-clear>Limpar</button><button class="btn ac" data-ok>Aplicar</button></div></div>`; };
  paint(); document.body.appendChild(el);
  el.addEventListener('input', (e) => { if (e.target.id === 'fm') { f.max = +e.target.value; const b = el.querySelector('p.b:nth-of-type(2) span'); } });
  el.addEventListener('click', (e) => { if (e.target === el || e.target.closest('[data-x]')) return el.remove(); const s = e.target.closest('[data-s]'); if (s) { f.sort = s.dataset.s; paint(); } const r = e.target.closest('[data-r]'); if (r) { f.rating = +r.dataset.r; paint(); } if (e.target.closest('[data-v]')) { f.ver = !f.ver; paint(); } if (e.target.closest('[data-clear]')) { Object.assign(f, { max: 300, rating: 0, ver: false, sort: 'rel' }); paint(); } if (e.target.closest('[data-ok]')) { S.f = { ...S.f, ...f }; save(); el.remove(); render(); } });
}
function seed() {
  const D = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return dk(d); };
  S = { setup: true, mode: 'cli', name: 'Marina Duarte', addr: 'Rua Oscar Freire, 512 — Pinheiros', fav: [1, 3, 5], bookings: [], wallet: 80, nid: 7010, f: { cat: -1, max: 300, rating: 0, ver: false, sort: 'rel' }, q: '' };
  const mk = (id, pid, si, date, time, status, rated) => { const p = pBy[pid], s = p[10][si]; S.bookings.push({ id, pid, svc: s[0], date, time, status, total: Math.round(s[1] * 1.12 * 100) / 100, pay: 'Cartão •••• 4821', rated }); };
  mk(7003, 1, 0, D(2), '09:00', 'confirmada'); mk(7005, 5, 0, D(4), '15:00', 'agendada'); mk(7001, 2, 1, D(-12), '10:00', 'concluída', 5); mk(7002, 7, 0, D(-6), '08:00', 'concluída'); mk(7000, 4, 0, D(-20), '11:00', 'concluída', 4); save();
}
let route = '';
function render() {
  const h = (location.hash || '#/').replace(/^#\/?/, ''), [r, a] = h.split('/');
  if (r === 'exemplo') { seed(); location.replace('#/' + (a || 'inicio')); return; }
  if (r === 'exemplo-pro') { seed(); S.mode = 'pro'; S.name = 'Helena Rocha'; save(); location.replace('#/' + (a || 'painel')); return; }
  if (!S.setup && r !== 'bem-vindo') { location.replace('#/bem-vindo'); return; }
  const map = { 'bem-vindo': V.bemvindo, inicio: V.inicio, buscar: V.buscar, prestador: () => V.prestador(a), reservar: () => V.reservar(a), pagamento: V.pagamento, confirmado: () => V.confirmado(a), reservas: V.reservas, reserva: () => V.reserva(a), avaliar: () => V.avaliar(a), mensagens: V.mensagens, chat: () => V.chat(a), conta: V.conta, favoritos: V.favoritos, painel: V.painel, solicitacoes: V.solicitacoes, solicitacao: () => V.solicitacao(a), agenda: V.agenda, ganhos: V.ganhos };
  const keep = route === h ? ($app.querySelector('.screen') || {}).scrollTop : 0;
  $app.innerHTML = (map[r] || V.inicio)(); route = h; const sc = $app.querySelector('.screen'); if (sc && keep) sc.scrollTop = keep;
  const q = document.getElementById('q'); if (q) q.oninput = () => { S.q = q.value; const t = S.q.toLowerCase(); const f = S.f; document.getElementById('bl').innerHTML = PROS.filter((p) => (f.cat < 0 || p[2] === f.cat) && (!t || (p[1] + p[3] + CATS[p[2]][0]).toLowerCase().includes(t))).map(lstCard).join('') || '<div class="card" style="text-align:center;color:var(--mut)">Nada encontrado.</div>'; };
}
window.addEventListener('hashchange', render);
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) { const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go; return; }
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'start': S.name = document.getElementById('o-n').value.trim() || 'Marina Duarte'; S.setup = true; S.mode = v; save(); location.hash = v === 'cli' ? '#/inicio' : '#/painel'; break;
    case 'mode': S.mode = v; save(); location.hash = v === 'cli' ? '#/inicio' : '#/painel'; break;
    case 'cat': S.f.cat = +v; save(); location.hash = '#/buscar'; break;
    case 'cat2': S.f.cat = +v; save(); render(); break;
    case 'filtros': filtros(); break;
    case 'fav': { e.stopPropagation(); const i = S.fav.indexOf(+v); i >= 0 ? S.fav.splice(i, 1) : S.fav.push(+v); save(); render(); break; }
    case 'bsvc': V._b.svc = +v; render(); break;
    case 'bdate': V._b.date = v; V._b.time = null; render(); break;
    case 'btime': V._b.time = v; render(); break;
    case 'bnext': V._b.obs = document.getElementById('bo').value; location.hash = '#/pagamento'; break;
    case 'pay': V._pay = v; render(); break;
    case 'cup': if (document.getElementById('cp').value.trim().toUpperCase() === 'PRESTO30') { V._cup = true; toast('Cupom aplicado: − R$ 30,00'); render(); } else toast('Cupom inválido'); break;
    case 'pagar': { const B = V._b, p = pBy[B.pid], s = p[10][B.svc], tot = s[1] * (1 + FEE) - (V._cup ? 30 : 0); if ((V._pay || 'cartao') === 'saldo' && S.wallet < tot) return toast('Saldo insuficiente'); if (V._pay === 'saldo') S.wallet -= tot; const b = { id: ++S.nid, pid: p[0], svc: s[0], date: B.date, time: B.time, status: 'agendada', total: Math.round(tot * 100) / 100, pay: { cartao: 'Cartão •••• 4821', pix: 'Pix', saldo: 'Saldo Prestô' }[V._pay || 'cartao'] }; S.bookings.push(b); V._b = null; V._cup = false; save(); location.replace('#/confirmado/' + b.id); break; }
    case 't': V._t = v; render(); break;
    case 'cancel': S.bookings.find((x) => x.id === +v).status = 'cancelada'; save(); toast('Reserva cancelada e valor estornado'); render(); break;
    case 'done': S.bookings.find((x) => x.id === +v).status = 'concluída'; save(); toast('Pagamento liberado ao profissional'); render(); break;
    case 'star': V._st = +v; render(); break;
    case 'enviar': { const b = S.bookings.find((x) => x.id === +v); b.rated = V._st || 5; save(); toast('Avaliação enviada. Obrigado!'); location.replace('#/reserva/' + v); break; }
    case 'rec': S.wallet += 100; save(); toast('+ R$ 100,00 adicionados'); render(); break;
    case 'aceitar': toast('Pedido aceito! O cliente foi avisado.'); location.hash = '#/agenda'; break;
    case 'ad': V._ad = +v; render(); break;
    case 'saque': toast('Saque via Pix solicitado'); break;
    case 'reset': if (confirm('Apagar todos os dados?')) { localStorage.removeItem('presto.v1'); location.hash = ''; location.reload(); } break;
  }
});
window.appBack = function () { const h = location.hash; if (/^#\/(inicio|buscar|reservas|mensagens|conta|painel|solicitacoes|agenda|ganhos|bem-vindo)?$/.test(h) || h === '') return false; history.back(); return true; };
if (!location.hash) location.hash = '#/inicio'; render();
})();
</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Backoffice — Lance Certo</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:var(--bg)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}.side .logo{padding:0 8px 20px}.side button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:600;margin-bottom:3px}.side button.on{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--g)}.side button i{margin-left:auto;font-style:normal;background:var(--gold);color:#2a1d00;border-radius:99px;font-size:11px;padding:1px 8px;font-weight:800}
main{padding:26px 30px;max-width:1200px}.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.k small{color:var(--mut);font-weight:600}.k b{display:block;font-size:26px;margin-top:4px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.login{max-width:380px;margin:14vh auto}.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 0}.bars div{flex:1;text-align:center;font-size:11.5px;color:var(--mut)}.bars i{display:block;border-radius:7px 7px 3px 3px;background:var(--g);margin:0 auto 6px;width:70%}.bars i.neg{background:var(--red)}
.ok{color:var(--g)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow-x:auto;gap:4px}.kp{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}main{padding:16px}}
</style></head>
<body><div id="root"></div>
<script>
const $=(s)=>document.querySelector(s);const money=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
let TAB='resumo',S=null;
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return{ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}}
function login(e){$('#root').innerHTML=`<div class="login"><div class="logo" style="margin-bottom:18px"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#04170e" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></i>Backoffice <em>Lance Certo</em></div><div class="panel pad"><div class="f"><label>E-mail</label><input class="inp" id="e" value="admin@lancecerto.com.br"></div><div class="f"><label>Senha</label><input class="inp" id="p" type="password"></div><div class="red sm" style="min-height:18px">${e||''}</div><button class="btn block" id="go">Entrar</button></div></div>`;
 const go=async()=>{const r=await api('POST','/api/login',{email:$('#e').value,password:$('#p').value});if(!r.ok)return login(r.data.error);if(r.data.user.role!=='admin')return login('Acesso restrito a administradores.');load()};$('#go').onclick=go;$('#p').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
async function load(){const r=await api('GET','/api/admin/summary');if(!r.ok)return login();S=r.data;draw()}
async function draw(){const nav=[['resumo','Resumo'],['usuarios','Usuários'],['apostas','Apostas'],['saques','Saques',S.pendingWd]];
 $('#root').innerHTML=`<div class="layout"><aside class="side"><div class="logo"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#04170e" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></i>Back<em>office</em></div>${nav.map(([k,l,n])=>`<button class="${TAB===k?'on':''}" data-t="${k}">${l}${n?`<i>${n}</i>`:''}</button>`).join('')}<button id="out" style="margin-top:20px">Sair</button></aside><main id="mn"></main></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;load()});$('#out').onclick=async()=>{await api('POST','/api/logout');login()};const m=$('#mn');
 if(TAB==='resumo'){const mx=Math.max(1,...S.daily.map(d=>Math.abs(d.ggr)));m.innerHTML=`<h1>Resumo operacional</h1><p class="mut">Atualizado em ${dt(Date.now())} • auditoria do ledger: <b class="${S.audit?'ok':'red'}">${S.audit?'✓ saldos conferem com as movimentações':'✗ divergência'}</b></p>
  <div class="kp"><div class="k"><small>GGR hoje</small><b class="${S.ggrToday>=0?'g':'red'}">${money(S.ggrToday)}</b></div><div class="k"><small>GGR acumulado</small><b>${money(S.ggr)}</b></div><div class="k"><small>Volume apostado</small><b>${money(S.stakes)}</b></div><div class="k"><small>RTP efetivo</small><b>${(S.rtp*100).toFixed(1)}%</b></div>
  <div class="k"><small>Usuários</small><b>${S.users}</b></div><div class="k"><small>Ativos hoje</small><b>${S.activeToday}</b></div><div class="k"><small>Apostas abertas</small><b>${S.openBets}</b></div><div class="k"><small>Exposição máxima</small><b class="gold">${money(S.exposure)}</b></div></div>
  <div class="two"><div class="panel pad"><h3>GGR dos últimos 7 dias</h3><div class="bars">${S.daily.map(d=>`<div><i class="${d.ggr<0?'neg':''}" style="height:${Math.max(4,Math.abs(d.ggr)/mx*120)}px"></i>${new Date(d.day).toLocaleDateString('pt-BR',{weekday:'short'})}<br><b style="color:var(--tx)">${money(d.ggr).replace(',00','')}</b></div>`).join('')}</div></div>
  <div class="panel pad"><h3>Resultado por jogo</h3>${S.byGame.map(g=>`<div class="tx"><div><b>${{dice:'Dados',roulette:'Roleta',slots:'Slots'}[g.game]||g.game}</b><br><span class="mut sm">${g.n} rodadas • ${money(g.stake)} apostados</span></div><div style="text-align:right"><b class="${g.stake-g.pay>=0?'g':'red'}">${money(g.stake-g.pay)}</b><br><span class="mut sm">RTP ${(g.stake?g.pay/g.stake*100:0).toFixed(1)}%</span></div></div>`).join('')||'<div class="empty">Sem rodadas.</div>'}</div></div>`}
 if(TAB==='usuarios'){const r=await api('GET','/api/admin/users');m.innerHTML=`<h1>Usuários</h1><div class="panel" style="margin-top:16px"><table><thead><tr><th>Usuário</th><th>CPF</th><th>Saldo</th><th>Depositado</th><th>Apostado</th><th>Prêmios</th><th></th></tr></thead><tbody>${r.data.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="mut sm">${esc(u.email)} • desde ${new Date(u.createdAt).toLocaleDateString('pt-BR')}</span></td><td>${esc(u.cpf)}</td><td>${money(u.balance)}</td><td>${money(u.deposited)}</td><td>${money(u.staked)}</td><td>${money(u.won)}</td><td><button class="btn sm ${u.blocked?'':'ghost'}" data-bl="${u.id}" data-v="${!u.blocked}">${u.blocked?'Desbloquear':'Bloquear'}</button></td></tr>`).join('')||'<tr><td colspan=7 class="empty">Nenhum usuário.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('[data-bl]').forEach(b=>b.onclick=async()=>{await api('PATCH','/api/admin/users/'+b.dataset.bl,{blocked:b.dataset.v==='true'});draw()})}
 if(TAB==='apostas'){const r=await api('GET','/api/admin/bets');m.innerHTML=`<h1>Apostas recentes</h1><div class="panel" style="margin-top:16px"><table><thead><tr><th>#</th><th>Usuário</th><th>Seleções</th><th>Odd</th><th>Valor</th><th>Status</th></tr></thead><tbody>${r.data.map(b=>`<tr><td>${b.id}</td><td>${esc(b.user)}</td><td>${b.legs.map(l=>esc(l.home)+' x '+esc(l.away)+' — '+l.market+' '+l.pick).join('<br>')}</td><td>${b.totalOdds.toFixed(2)}</td><td>${money(b.stake)}</td><td><span class="st ${b.status}">${b.status.toUpperCase()}</span></td></tr>`).join('')||'<tr><td colspan=6 class="empty">Sem apostas.</td></tr>'}</tbody></table></div>`}
 if(TAB==='saques'){const r=await api('GET','/api/admin/withdrawals');m.innerHTML=`<h1>Saques</h1><div class="panel" style="margin-top:16px"><table><thead><tr><th>#</th><th>Usuário</th><th>Chave</th><th>Valor</th><th>Solicitado</th><th>Status</th><th></th></tr></thead><tbody>${r.data.map(w=>`<tr><td>${w.id}</td><td>${esc(w.name)}</td><td>${esc(w.key)}</td><td><b>${money(w.amount)}</b></td><td>${dt(w.at)}</td><td><span class="st ${w.status==='aprovado'?'won':w.status==='recusado'?'lost':'open'}">${w.status.toUpperCase()}</span></td><td>${w.status==='pendente'?`<button class="btn sm" data-wd="${w.id}" data-s="aprovado">Aprovar</button> <button class="btn sm red" data-wd="${w.id}" data-s="recusado">Recusar</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="empty">Nenhum saque.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=async()=>{await api('PATCH','/api/admin/withdrawals/'+b.dataset.wd,{status:b.dataset.s});load()})}}
load();
</script></body></html>

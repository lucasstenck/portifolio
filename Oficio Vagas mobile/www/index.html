<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fafaf7">
<title>ofício — vagas e talentos</title>
<style>
:root{--bg:#fafaf7;--paper:#fff;--ink:#111110;--mut:#8a8a85;--line:#e4e3dd;--line2:#efeee9;--ac:#ff4b1f;--ac2:#e63a10;--ok:#1f8a5b;--wrn:#c98a00;--r:6px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Inter,"Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
body{font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}input,textarea,select{font:inherit;color:var(--ink)}p{margin:0}h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.035em;line-height:1.08}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.screen{flex:1;overflow-y:auto;padding:22px 24px 120px}.screen::-webkit-scrollbar{display:none}
.mut{color:var(--mut)}.sm{font-size:12.5px}.cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:500}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.logo{font-size:23px;font-weight:600;letter-spacing:-.05em}.logo i{font-style:normal;color:var(--ac)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.sw2{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--paper);font-size:12.5px}.sw2 button{padding:6px 14px;border-radius:99px;color:var(--mut);font-weight:500}.sw2 button.on{background:var(--ink);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:500;font-size:15px;width:100%;letter-spacing:-.01em}.btn:active{opacity:.85}.btn.ac{background:var(--ac)}.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.btn.sm{height:36px;width:auto;padding:0 16px;font-size:13px}.btn:disabled{opacity:.3}
.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);padding:0 0 12px;margin-bottom:18px}.search svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6}.search input{border:0;background:none;outline:0;flex:1;font-size:17px;letter-spacing:-.02em}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -24px 8px;padding:0 24px}.chips::-webkit-scrollbar{display:none}.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--paper);color:var(--ink)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.job{padding:20px 0;border-top:1px solid var(--line)}.job:first-of-type{border-top:1px solid var(--ink)}
.mark{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;font-weight:600;font-size:16px;color:#fff;flex:none;letter-spacing:-.03em}
.job h3{font-size:19px;margin:12px 0 4px}.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut)}.meta b{color:var(--ink);font-weight:500}
.tg{display:inline-block;padding:3px 9px;border:1px solid var(--line);border-radius:99px;font-size:11.5px;margin:10px 6px 0 0;color:var(--mut)}.tg.hot{border-color:var(--ac);color:var(--ac)}
.save{width:34px;height:34px;display:grid;place-items:center}.save svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.5}.save.on svg{fill:var(--ac);stroke:var(--ac)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px}.sec h2{font-size:21px}.sec a,.lnk{font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(250,250,247,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20}.tabs a{flex:1;text-align:center;font-size:12px;color:var(--mut);text-decoration:none;padding:6px 0;position:relative;font-weight:500}.tabs a.on{color:var(--ink)}.tabs a.on:after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.back{font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;margin-bottom:22px;text-decoration:none}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}.kpi div{padding:16px 0}.kpi div+div{padding-left:16px;border-left:1px solid var(--line)}.kpi b{display:block;font-size:30px;font-weight:500;letter-spacing:-.05em;line-height:1}.kpi span{font-size:12px;color:var(--mut)}
.field{display:block;margin-bottom:18px}.field span{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0 10px;font-size:16px;outline:0;border-radius:0}.field textarea{height:96px;resize:none;border:1px solid var(--line);padding:12px;border-radius:var(--r);background:var(--paper)}.field input:focus,.field select:focus{border-color:var(--ink)}
.steps{display:flex;gap:6px;margin-bottom:24px}.steps i{flex:1;height:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.stg{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--line2)}.stg:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mut)}.stg.ok:before{background:var(--ok)}.stg.ac:before{background:var(--ac)}.stg.w:before{background:var(--wrn)}
.line{height:1px;background:var(--line)}.bar{height:3px;background:var(--line2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.cand{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);align-items:center}.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:15px;flex:none}
.score{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;position:relative}
.kb{display:flex;gap:10px;overflow-x:auto;margin:0 -24px;padding:0 24px 8px}.kb::-webkit-scrollbar{display:none}.col{flex:none;width:230px}.col h4{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--mut);display:flex;justify-content:space-between}.kc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.sheet{position:fixed;inset:0;background:rgba(17,17,16,.4);z-index:50;display:flex;align-items:flex-end;max-width:520px;margin:auto}.sheet .in{width:100%;background:var(--bg);padding:22px 24px 28px;max-height:88%;overflow:auto;border-top:1px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r);font-size:14px;z-index:90}
.msg{padding:16px 0;border-top:1px solid var(--line);display:flex;gap:14px}.dotp{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none;margin-top:7px}
.ch{max-width:80%;padding:11px 14px;border-radius:14px;margin-bottom:8px;font-size:14.5px}.ch.me{background:var(--ink);color:#fff;margin-left:auto;border-bottom-right-radius:3px}.ch.he{background:var(--line2);border-bottom-left-radius:3px}
.day{display:grid;place-items:center;width:44px;height:52px;border:1px solid var(--line);border-radius:var(--r);flex:none;text-align:center;font-size:11px;color:var(--mut);background:var(--paper)}.day b{display:block;font-size:19px;color:var(--ink);font-weight:500;line-height:1}.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}.day.on b{color:#fff}
.slot{padding:12px 0;border:1px solid var(--line);border-radius:var(--r);text-align:center;background:var(--paper);font-size:14px}.slot.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const $app = document.getElementById('app');
const R = (n) => 'R$ ' + Math.round(n).toLocaleString('pt-BR');
const COL = ['#111110', '#ff4b1f', '#2d5be3', '#1f8a5b', '#7a3ff2', '#c98a00', '#0f7c8a', '#b5265c'];
const COMP = { 1: ['Atlas Pay', 'Fintech', 0], 2: ['Verde Campo', 'Agronegócio', 3], 3: ['Linha 9 Logística', 'Logística', 5], 4: ['Clínica Mirante', 'Saúde', 6], 5: ['Estúdio Cobre', 'Design', 1], 6: ['Rede Horizonte', 'Varejo', 2], 7: ['Nuvem Dados', 'Tecnologia', 4] };
const JOBS = [
  [1, 'Desenvolvedora Back-end Sênior', 1, 'São Paulo, SP', 'Híbrido', 16000, 21000, 'CLT', 'Sênior', ['Node.js', 'PostgreSQL', 'AWS', 'Microsserviços'], 'Vamos construir a infraestrutura de pagamentos instantâneos da Atlas Pay. Você vai desenhar APIs críticas, revisar arquitetura e mentorar pessoas do time de 12 engenheiros.', ['5+ anos com Node.js ou Go', 'Experiência com bancos relacionais e filas', 'Cultura de testes e observabilidade'], ['Plano de saúde e odontológico', 'Participação nos lucros', 'Auxílio home office'], 2],
  [2, 'Analista de Dados Pleno', 7, 'Remoto', 'Remoto', 9000, 12500, 'CLT', 'Pleno', ['SQL', 'Python', 'Power BI', 'Estatística'], 'Responsável por transformar dados de clientes em decisões. Você vai criar painéis, conduzir análises exploratórias e apoiar times de produto.', ['3+ anos em análise de dados', 'SQL avançado', 'Boa comunicação com áreas de negócio'], ['Vale-refeição flexível', 'Gympass', 'Dia de folga no aniversário'], 5],
  [3, 'Designer de Produto', 5, 'Belo Horizonte, MG', 'Presencial', 8000, 11000, 'CLT', 'Pleno', ['Figma', 'Design System', 'Pesquisa com usuários'], 'No Estúdio Cobre você desenha produtos digitais de ponta a ponta, da pesquisa à entrega, com times pequenos e autonomia.', ['Portfólio com projetos reais', 'Domínio de Figma e prototipação', 'Experiência com design systems'], ['Plano de saúde', 'Horário flexível', 'Budget para cursos'], 3],
  [4, 'Coordenador de Operações', 3, 'Campinas, SP', 'Presencial', 7500, 9800, 'CLT', 'Pleno', ['Gestão de equipes', 'WMS', 'Indicadores', 'Excel'], 'Liderar a operação de um centro de distribuição com 60 colaboradores, garantindo SLA, segurança e produtividade.', ['Experiência em CD ou transporte', 'Gestão de pessoas e metas', 'Excel avançado'], ['Vale-alimentação', 'Plano de saúde', 'Bônus por desempenho'], 1],
  [5, 'Enfermeiro(a) Assistencial', 4, 'Curitiba, PR', 'Presencial', 5200, 6400, 'CLT', 'Pleno', ['Coren ativo', 'Urgência', 'Protocolos'], 'Atendimento assistencial em clínica de média complexidade, com escala 12×36 e equipe multidisciplinar.', ['Coren ativo', 'Experiência em urgência', 'Disponibilidade para escala 12×36'], ['Convênio médico', 'Vale-transporte', 'Ajuda de custo para plantão'], 4],
  [6, 'Gerente de Loja', 6, 'Recife, PE', 'Presencial', 6800, 8500, 'CLT', 'Sênior', ['Varejo', 'Gestão de equipes', 'Metas', 'Estoque'], 'Gerenciar loja de grande fluxo, liderando vendas, equipe e experiência do cliente com foco em resultados.', ['Experiência em varejo de moda ou eletro', 'Gestão de metas e indicadores', 'Liderança de equipes de 20+ pessoas'], ['Comissão por resultados', 'Plano de saúde', 'Desconto em produtos'], 8],
  [7, 'Engenheiro de Dados', 7, 'Remoto', 'Remoto', 13000, 17500, 'PJ', 'Sênior', ['Python', 'Spark', 'Airflow', 'AWS'], 'Construir e manter pipelines de dados em larga escala para clientes de grande porte.', ['Experiência com pipelines em nuvem', 'Python e SQL avançados', 'Modelagem dimensional'], ['Contrato flexível', 'Equipamento fornecido', 'Budget de certificações'], 6],
  [8, 'Analista Financeiro Júnior', 1, 'São Paulo, SP', 'Híbrido', 4800, 6200, 'CLT', 'Júnior', ['Excel', 'Fluxo de caixa', 'ERP'], 'Apoiar o time de tesouraria na conciliação, previsão de caixa e relatórios gerenciais.', ['Graduação em Administração, Contábeis ou Economia', 'Excel intermediário', 'Vontade de aprender'], ['Vale-refeição', 'Plano de saúde', 'Auxílio educação'], 1],
  [9, 'Técnico Agrícola', 2, 'Ribeirão Preto, SP', 'Presencial', 4500, 5800, 'CLT', 'Pleno', ['Agricultura de precisão', 'Campo', 'Relatórios'], 'Acompanhamento técnico de lavouras, coleta de dados em campo e suporte a produtores parceiros.', ['Formação técnica em Agropecuária', 'CNH B', 'Disponibilidade para viagens'], ['Veículo da empresa', 'Seguro de vida', 'Bônus safra'], 7],
];
const jBy = Object.fromEntries(JOBS.map((j) => [j[0], j]));
const CANDS = [['Beatriz Nogueira', 'Dev. Back-end', 8, ['Node.js', 'PostgreSQL', 'AWS', 'Docker'], 'São Paulo, SP', 'Triagem'], ['Rafael Teixeira', 'Eng. de Software', 6, ['Go', 'Node.js', 'Microsserviços', 'Kubernetes'], 'Campinas, SP', 'Entrevista'], ['Larissa Campos', 'Dev. Full-stack', 4, ['Node.js', 'React', 'PostgreSQL'], 'Remoto', 'Recebida'], ['Eduardo Barreto', 'Arquiteto de Software', 12, ['AWS', 'Microsserviços', 'Node.js', 'PostgreSQL', 'Java'], 'São Paulo, SP', 'Proposta'], ['Marina Teles', 'Dev. Back-end', 3, ['Python', 'Node.js'], 'Santos, SP', 'Recebida'], ['Gustavo Pires', 'Dev. Back-end', 7, ['Node.js', 'AWS', 'PostgreSQL', 'Redis'], 'Osasco, SP', 'Entrevista']];
const STAGES = ['Recebida', 'Triagem', 'Entrevista', 'Proposta', 'Contratada'];
const SKILLS = ['Node.js', 'PostgreSQL', 'AWS', 'SQL', 'Python', 'Figma', 'Excel', 'Gestão de equipes'];
const match = (skills, tags) => Math.round(tags.filter((t) => skills.includes(t)).length / tags.length * 100);

let S; try { S = JSON.parse(localStorage.getItem('oficio.v1')); } catch (e) { S = null; }
if (!S) S = { setup: false, mode: 'cand', name: '', cargo: '', skills: [], saved: [], apps: [], q: '', f: 'Todas', msgs: {}, nid: 1, posted: [] };
const save = () => { try { localStorage.setItem('oficio.v1', JSON.stringify(S)); } catch (e) {} };
const toast = (t) => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1900); };
const IC = { s: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>', b: '<path d="M6 3h12v18l-6-4-6 4z"/>' };
const mark = (cid, s = 40) => `<div class="mark" style="width:${s}px;height:${s}px;background:${COL[COMP[cid][2]]};font-size:${s * .4}px">${COMP[cid][0][0]}</div>`;
const salary = (j) => `${R(j[5])} – ${R(j[6])}`;
const tabs = (c) => { const L = S.mode === 'cand' ? [['vagas', 'Vagas'], ['candidaturas', 'Candidaturas'], ['mensagens', 'Mensagens'], ['perfil', 'Perfil']] : [['painel', 'Painel'], ['minhas-vagas', 'Vagas'], ['candidatos', 'Candidatos'], ['agenda', 'Agenda'], ['empresa', 'Empresa']]; return `<nav class="tabs">${L.map(([k, l]) => `<a href="#/${k}" class="${c === k ? 'on' : ''}">${l}</a>`).join('')}</nav>`; };
const head = () => `<div class="hd"><div class="logo">ofício<i>.</i></div><div class="sw2"><button class="${S.mode === 'cand' ? 'on' : ''}" data-act="mode" data-v="cand">Candidato</button><button class="${S.mode === 'emp' ? 'on' : ''}" data-act="mode" data-v="emp">Empresa</button></div></div>`;
const back = '<a class="back" href="javascript:history.back()">← Voltar</a>';
const jobRow = (j) => { const m = match(S.skills, j[9]); return `<div class="job" data-go="#/vaga/${j[0]}"><div class="row sp">${mark(j[2])}<button class="save ${S.saved.includes(j[0]) ? 'on' : ''}" data-act="save" data-v="${j[0]}"><svg viewBox="0 0 24 24">${IC.b}</svg></button></div><h3>${j[1]}</h3><div class="meta"><b>${COMP[j[2]][0]}</b><span>${j[3]}</span><span>${j[4]}</span></div><div class="meta" style="margin-top:6px"><b>${salary(j)}</b><span>${j[7]}</span><span>há ${j[13]} ${j[13] === 1 ? 'dia' : 'dias'}</span></div>${j[9].slice(0, 3).map((t) => `<span class="tg ${S.skills.includes(t) ? 'hot' : ''}">${t}</span>`).join('')}${m >= 50 ? `<span class="tg hot" style="border-style:dashed">${m}% compatível</span>` : ''}</div>`; };

const V = {};
V.inicio = () => `<div class="screen" style="padding-bottom:30px"><div class="logo" style="margin:10px 0 56px">ofício<i>.</i></div><p class="cap">Vagas e talentos</p><h1 style="font-size:44px;margin:14px 0 18px;letter-spacing:-.05em">O trabalho certo,<br>sem ruído<span style="color:var(--ac)">.</span></h1><p class="mut" style="font-size:17px;max-width:360px;margin-bottom:38px">Candidate-se em um toque ou publique vagas e conduza todo o processo seletivo em um só lugar.</p>
<label class="field"><span>Seu nome</span><input id="o-n" value="${S.name}" placeholder="Nome completo"></label><label class="field"><span>Cargo ou área de interesse</span><input id="o-c" value="${S.cargo}" placeholder="Ex.: Desenvolvedor back-end"></label><p class="cap" style="margin-bottom:10px">Principais habilidades</p><div class="chips" style="flex-wrap:wrap;margin:0 0 30px;overflow:visible">${SKILLS.map((s) => `<button class="chip ${S.skills.includes(s) ? 'on' : ''}" data-act="sk" data-v="${s}">${s}</button>`).join('')}</div>
<button class="btn" data-act="start" data-v="cand">Procurar vagas</button><button class="btn o" style="margin-top:10px" data-act="start" data-v="emp">Sou empresa e quero contratar</button></div>`;
V.vagas = () => { const q = S.q.toLowerCase(), f = S.f; const L = JOBS.filter((j) => (f === 'Todas' || (f === 'Remoto' ? j[4] === 'Remoto' : f === 'Salvas' ? S.saved.includes(j[0]) : j[8] === f)) && (!q || (j[1] + COMP[j[2]][0] + j[9].join(' ')).toLowerCase().includes(q))).sort((a, b) => match(S.skills, b[9]) - match(S.skills, a[9]));
  return `<div class="screen">${head()}<h1 style="font-size:30px;margin-bottom:18px">${S.name ? 'Olá, ' + S.name.split(' ')[0] + '.' : 'Vagas'}<br><span class="mut">${L.length} oportunidades para você.</span></h1><label class="search"><svg viewBox="0 0 24 24">${IC.s}</svg><input id="q" placeholder="Cargo, empresa ou habilidade" value="${S.q}"></label><div class="chips">${['Todas', 'Remoto', 'Júnior', 'Pleno', 'Sênior', 'Salvas'].map((x) => `<button class="chip ${f === x ? 'on' : ''}" data-act="f" data-v="${x}">${x}</button>`).join('')}</div><div id="jl" style="margin-top:12px">${L.map(jobRow).join('') || '<p class="mut" style="padding:40px 0;text-align:center">Nenhuma vaga encontrada.</p>'}</div></div>${tabs('vagas')}`; };
V.vaga = (id) => { const j = jBy[+id]; if (!j) return V.vagas(); const m = match(S.skills, j[9]), ap = S.apps.find((a) => a.jid === j[0]);
  return `<div class="screen" style="padding-bottom:140px">${back}<div class="row sp">${mark(j[2], 52)}<button class="save ${S.saved.includes(j[0]) ? 'on' : ''}" data-act="save" data-v="${j[0]}"><svg viewBox="0 0 24 24">${IC.b}</svg></button></div><p class="cap" style="margin-top:16px">${COMP[j[2]][0]} • ${COMP[j[2]][1]}</p><h1 style="font-size:32px;margin:8px 0 14px">${j[1]}</h1><div class="meta"><b>${j[3]}</b><span>${j[4]}</span><span>${j[7]}</span><span>${j[8]}</span></div>
  <div class="kpi" style="margin:22px 0"><div><b>${salary(j).split(' – ')[0].replace('R$ ', '')}</b><span>mínimo/mês</span></div><div><b>${salary(j).split(' – ')[1].replace('R$ ', '')}</b><span>máximo/mês</span></div><div><b style="color:var(--ac)">${m}%</b><span>compatível</span></div></div>
  <p class="cap">Sobre a vaga</p><p style="margin:8px 0 22px;font-size:16px">${j[10]}</p><p class="cap">Requisitos</p><div style="margin:8px 0 22px">${j[11].map((r) => `<p style="padding:8px 0;border-top:1px solid var(--line)">${r}</p>`).join('')}</div><p class="cap">Habilidades</p><div style="margin-bottom:22px">${j[9].map((t) => `<span class="tg ${S.skills.includes(t) ? 'hot' : ''}">${t}</span>`).join('')}</div><p class="cap">Benefícios</p><div style="margin:8px 0 10px">${j[12].map((r) => `<p style="padding:8px 0;border-top:1px solid var(--line)">${r}</p>`).join('')}</div>
  <div style="position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;padding:14px 24px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--bg);border-top:1px solid var(--line)">${ap ? `<div class="row sp"><span class="stg ${ap.stage > 1 ? 'ac' : ''}">Candidatura: ${STAGES[ap.stage]}</span><a class="lnk" href="#/candidaturas">Acompanhar</a></div>` : `<button class="btn ac" data-go="#/candidatar/${j[0]}">Candidatar-se</button>`}</div></div>`; };
V.candidatar = (id) => { const j = jBy[+id], st = V._st || 1; if (!j) return V.vagas();
  const steps = `<div class="steps">${[1, 2, 3].map((i) => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div>`;

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) { const g = e.target.closest('[data-go]'); if (g) { V._st = 1; location.hash = g.dataset.go; } return; }
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'sk': { const i = S.skills.indexOf(v); i >= 0 ? S.skills.splice(i, 1) : S.skills.push(v); S.name = document.getElementById('o-n').value; S.cargo = document.getElementById('o-c').value; save(); render(); break; }
    case 'start': S.name = document.getElementById('o-n').value.trim() || 'Marina Duarte'; S.cargo = document.getElementById('o-c').value; S.setup = true; S.mode = v; save(); location.hash = v === 'cand' ? '#/vagas' : '#/painel'; break;
    case 'mode': S.mode = v; save(); location.hash = v === 'cand' ? '#/vagas' : '#/painel'; break;
    case 'f': S.f = v; render(); break;
    case 'save': { e.stopPropagation(); const i = S.saved.indexOf(+v); i >= 0 ? S.saved.splice(i, 1) : S.saved.push(+v); save(); render(); break; }
    case 'stb': if ((V._st || 1) > 1) { V._st--; render(); } else history.back(); break;
    case 'stn': { V._st = (V._st || 1) + 1; if (V._st > 3) { S.apps.unshift({ jid: +v, stage: 0, when: 'agora', note: '' }); save(); V._st = 1; location.replace('#/enviada/' + v); } else render(); break; }
    case 'psk': { const f = V._pub; const i = f.skills.indexOf(v); i >= 0 ? f.skills.splice(i, 1) : f.skills.push(v); f.t = document.getElementById('p-t').value; render(); break; }
    case 'pub': { const t = document.getElementById('p-t').value.trim(); if (!t) return toast('Informe o título da vaga'); S.posted.unshift({ id: 100 + S.nid++, t, loc: document.getElementById('p-l').value, mod: document.getElementById('p-m').value, n: 0, v: 0, st: 'Ativa' }); V._pub = null; save(); toast('Vaga publicada'); location.replace('#/minhas-vagas'); break; }
    case 'cs': V._cs = v; render(); break;
    case 'dd': V._d = +v; render(); break;
    case 'rej': toast('Candidato recusado e notificado'); history.back(); break;
    case 'agendar': toast('Convite de entrevista enviado'); location.hash = '#/agenda'; break;
    case 'reset': if (confirm('Apagar todos os dados?')) { localStorage.removeItem('oficio.v1'); location.hash = ''; location.reload(); } break;
  }
});
window.appBack = function () { const h = location.hash; if (/^#\/(inicio|vagas|candidaturas|mensagens|perfil|painel|minhas-vagas|candidatos|agenda|empresa)?$/.test(h) || h === '') return false; history.back(); return true; };
if (!location.hash) location.hash = '#/vagas'; render();
})();
</script>
</body>

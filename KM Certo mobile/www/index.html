<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f4f0">
<title>KM Certo — cálculo de corridas</title>
<style>
:root{--bg:#f4f4f0;--card:#fff;--ink:#0b0d0b;--mut:#7b807a;--line:#e3e4de;--lcd:#070b08;--g:#39ff8b;--g2:#16a85a;--am:#ffc400;--red:#ff4b4b;--r:16px;--mono:"Cascadia Mono","Courier New",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Arial Narrow","Helvetica Neue",Arial,system-ui,sans-serif;overscroll-behavior:none}
body{font-size:15px;line-height:1.35;overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}input,select{font:inherit;color:var(--ink)}p{margin:0}h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;overflow-y:auto;padding:16px 16px 110px}.screen::-webkit-scrollbar{display:none}
.mut{color:var(--mut)}.sm{font-size:12px}.cap{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}.mono{font-family:var(--mono)}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900;font-size:21px;letter-spacing:-.02em;text-transform:uppercase}.brand i{font-style:normal;background:var(--ink);color:var(--g);padding:1px 7px;border-radius:6px;margin-right:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e7e8e1;border-radius:12px;padding:3px}.seg button{padding:10px 6px;border-radius:9px;font-weight:800;font-size:13px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}.seg button.on{background:var(--ink);color:var(--g)}
.lcd{background:var(--lcd);border-radius:20px;padding:18px 20px;position:relative;overflow:hidden;border:2px solid #1b241d;box-shadow:inset 0 0 40px rgba(57,255,139,.06),0 14px 30px -18px rgba(0,0,0,.6)}
.lcd .lb{display:flex;justify-content:space-between;font:700 10px var(--mono);letter-spacing:.2em;color:#4b7a5c;text-transform:uppercase}.lcd .big{font:700 56px/1.05 var(--mono);color:var(--g);text-shadow:0 0 18px rgba(57,255,139,.55);letter-spacing:.02em;text-align:right;position:relative;margin:10px 0 4px}.lcd .big:before{content:attr(data-g);position:absolute;right:0;color:rgba(57,255,139,.07);text-shadow:none}
.lcd .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;border-top:1px solid #16231a;padding-top:12px}.lcd .mini div b{display:block;font:700 18px var(--mono);color:#b8ffd5}.lcd .mini div span{font:600 9.5px var(--mono);letter-spacing:.14em;color:#4b7a5c;text-transform:uppercase}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.inp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.in{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px 8px;position:relative}.in small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700}.in input{width:100%;border:0;background:none;outline:0;font:800 28px var(--mono);padding:2px 0;letter-spacing:-.04em}.in u{position:absolute;right:14px;bottom:14px;text-decoration:none;font:700 12px var(--mono);color:var(--mut)}.in:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(57,255,139,.35)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}.tg b{text-transform:uppercase;font-size:14px;letter-spacing:.02em}.sw{width:48px;height:28px;border-radius:99px;background:#d9dad3;position:relative;flex:none}.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}.sw.on{background:var(--g2)}.sw.on:after{left:23px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:14px;background:var(--ink);color:var(--g);font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;width:100%}.btn:active{transform:scale(.985)}.btn.g{background:var(--g);color:#04170a}.btn.w{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{height:40px;width:auto;padding:0 16px;font-size:12.5px;border-radius:10px}.btn.red{background:var(--red);color:#fff}
.ln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dotted #cfd1c9;font-size:14px}.ln:last-child{border:0}.ln span{color:var(--mut)}.ln b{font-family:var(--mono);font-weight:700}.ln.t{border-top:2px solid var(--ink);border-bottom:0;margin-top:6px;padding-top:12px}.ln.t span{color:var(--ink);font-weight:800;text-transform:uppercase}.ln.t b{font-size:20px}
.pos{color:var(--g2)}.neg{color:var(--red)}
.verd{border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;margin-bottom:12px}.verd.ok{background:#d8f8e4;border:2px solid var(--g2)}.verd.no{background:#ffe0e0;border:2px solid var(--red)}.verd.mid{background:#fff3c4;border:2px solid var(--am)}.verd .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;flex:none}.verd.ok .ic{background:var(--g2)}.verd.no .ic{background:var(--red)}.verd.mid .ic{background:var(--am);color:var(--ink)}.verd h3{font-size:19px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--ink);padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:20}.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7c8a80;text-decoration:none;padding:6px 0}.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tabs a.on{color:var(--g)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;margin-bottom:14px}
.run{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px dotted #cfd1c9}.run .tp{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--g);display:grid;place-items:center;font:800 11px var(--mono);flex:none}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}.bars div{flex:1;text-align:center;font:700 10px var(--mono);color:var(--mut)}.bars i{display:block;border-radius:5px 5px 0 0;background:var(--ink);margin-bottom:6px}.bars i.hi{background:var(--g2)}
.prog{height:12px;background:#e1e2db;border-radius:12px;overflow:hidden;position:relative}.prog i{display:block;height:100%;background:repeating-linear-gradient(135deg,var(--g2) 0 8px,#1b8a4b 8px 16px)}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:0;font:700 17px var(--mono)}.field input:focus{border-color:var(--ink)}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:#e7e8e1;font:700 11px var(--mono);letter-spacing:.04em}.chip.g{background:#d8f8e4;color:#0d6b37}.chip.r{background:#ffe0e0;color:#a11f1f}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--g);padding:12px 20px;border-radius:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;z-index:90}
.rc{background:#fffef6;border:1px solid #e8e5cf;border-radius:6px;padding:22px 20px;font-family:var(--mono);font-size:13px;position:relative;box-shadow:0 10px 24px -16px rgba(0,0,0,.4)}.rc:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,#fffef6 50%,transparent 50%) 0 0/16px 8px,linear-gradient(-135deg,#fffef6 50%,transparent 50%) 0 0/16px 8px}.rc hr{border:0;border-top:1px dashed #bbb;margin:12px 0}.rc .l{display:flex;justify-content:space-between;padding:3px 0}
.meter{display:grid;place-items:center;margin:8px 0 14px}.dial{width:210px;height:210px;border-radius:50%;background:conic-gradient(var(--g2) var(--p,0deg),#dedfd8 0);display:grid;place-items:center}.dial div{width:176px;height:176px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center}.dial b{font:800 38px var(--mono);letter-spacing:-.04em}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const $app = document.getElementById('app');
const R = (n) => 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const N = (n, d = 1) => n.toFixed(d).replace('.', ',');
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const lcd = (v) => (v < 0 ? '-' : '') + Math.abs(v).toFixed(2).replace('.', ',').padStart(6, ' ').replace(/ /g, ' ');
const IC = { calc: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M16 12h0M8 16h2M12 16h2M16 16h0"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', day: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', tag: '<path d="M3 12V3h9l9 9-9 9zM7.500 7.500h.01"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', back: '<path d="M15 5l-7 7 7 7"/>' };
const ic = (n) => `<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
const tabs = (c) => `<nav class="tabs">${[['calcular', 'Calcular', 'calc'], ['corridas', 'Corridas', 'list'], ['dia', 'Resumo', 'day'], ['tarifas', 'Tarifas', 'tag'], ['perfil', 'Perfil', 'user']].map(([k, l, i]) => `<a href="#/${k}" class="${c === k ? 'on' : ''}">${ic(i)}${l}</a>`).join('')}</nav>`;
const back = '<a class="back" href="javascript:history.back()">← Voltar</a>';

let S; try { S = JSON.parse(localStorage.getItem('kmcerto.v1')); } catch (e) { S = null; }
const DEF = () => ({ setup: false, nome: '', tipo: 'carro', ativo: 0, veic: [{ nome: 'Carro (flex)', tipo: 'carro', consumo: 11.5, comb: 5.89, manut: 0.22, deprec: 0.3 }, { nome: 'Moto 160cc', tipo: 'moto', consumo: 38, comb: 5.89, manut: 0.09, deprec: 0.08 }], tar: [{ nome: 'Particular — carro', base: 5, km: 2.4, min: 0.45, esp: 0.6, minima: 12, noturno: 20, bandeira2: 25 }, { nome: 'Entregas — moto', base: 4, km: 1.6, min: 0.3, esp: 0.4, minima: 8, noturno: 15, bandeira2: 20 }], tarAtiva: 0, calc: { km: 8.4, min: 22, esp: 0, ped: 0, noturno: false, b2: false, surge: 1, fee: 0 }, runs: [], fuel: [], exp: [], meta: { dia: 250, mes: 6500, hora: 35, km: 1.5 }, nid: 100 });
if (!S) S = DEF();
const save = () => { try { localStorage.setItem('kmcerto.v1', JSON.stringify(S)); } catch (e) {} };
const toast = (t) => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1800); };
const veh = () => S.veic[S.ativo] || S.veic[0];
const tar = () => S.tar[S.tarAtiva] || S.tar[0];
function calc(c, t = tar(), v = veh()) {
  const lines = [['Bandeirada', t.base], [`Distância (${N(c.km)} km × ${R(t.km)})`, c.km * t.km], [`Tempo (${c.min} min × ${R(t.min)})`, c.min * t.min]]; if (c.esp) lines.push([`Espera (${c.esp} min)`, c.esp * t.esp]); if (c.ped) lines.push(['Pedágio', c.ped]);
  let sub = lines.reduce((a, l) => a + l[1], 0), minAplic = false; if (sub < t.minima) { sub = t.minima; minAplic = true; }
  const adds = []; if (c.noturno) adds.push([`Adicional noturno (${t.noturno}%)`, sub * t.noturno / 100]); if (c.b2) adds.push([`Bandeira 2 (${t.bandeira2}%)`, sub * t.bandeira2 / 100]);
  let total = sub + adds.reduce((a, l) => a + l[1], 0); if (c.surge > 1) { adds.push([`Dinâmico × ${N(c.surge)}`, total * (c.surge - 1)]); total *= c.surge; }
  const fee = total * (c.fee || 0) / 100, comb = c.km / v.consumo * v.comb, manut = c.km * v.manut, dep = c.km * v.deprec, custo = comb + manut + dep, liq = total - fee - custo, horas = Math.max(1, c.min + (c.esp || 0)) / 60;
  return { lines, adds, total, minAplic, fee, comb, manut, dep, custo, liq, porKm: liq / Math.max(.1, c.km), porHora: liq / horas };
}
const verdict = (r) => { const m = S.meta; const okKm = r.porKm >= m.km, okH = r.porHora >= m.hora; return okKm && okH ? ['ok', '✓', 'Vale a pena', 'Acima das suas metas de R$/km e R$/hora.'] : (!okKm && !okH) || r.liq <= 0 ? ['no', '✕', 'Não compensa', 'Abaixo das metas de lucro por km e por hora.'] : ['mid', '!', 'Aceitável', okKm ? 'Bom por km, mas o tempo gasto reduz o lucro por hora.' : 'Bom por hora, mas fica abaixo da meta por km.']; };

const V = {};
V.onboarding = () => `<div class="screen" style="padding-bottom:30px"><div class="brand" style="margin:12px 0 34px"><i>KM</i>Certo</div><p class="cap">Para motoristas e motoboys</p><h1 style="font-size:44px;margin:10px 0 12px">Saiba quanto<br>cobrar e quanto<br><span style="background:var(--ink);color:var(--g);padding:0 8px;border-radius:8px">sobra.</span></h1><p class="mut" style="margin-bottom:26px;font-size:16px;font-family:system-ui;max-width:360px">Calcule o valor da corrida, desconte combustível, manutenção e comissão e descubra o lucro real de cada viagem.</p>
<label class="field"><span>Seu nome</span><input id="o-n" value="${S.nome}" placeholder="Nome" style="font-family:system-ui"></label><p class="cap" style="margin-bottom:8px">Você trabalha com</p><div class="seg" style="margin-bottom:18px"><button class="${S.tipo === 'carro' ? 'on' : ''}" data-act="tp" data-v="carro">Carro</button><button class="${S.tipo === 'moto' ? 'on' : ''}" data-act="tp" data-v="moto">Moto</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="field"><span>Consumo (km/l)</span><input id="o-c" value="${S.tipo === 'moto' ? 38 : 11.5}" inputmode="decimal"></label><label class="field"><span>Combustível (R$/l)</span><input id="o-p" value="5.89" inputmode="decimal"></label></div><button class="btn g" data-act="start" style="margin-top:8px">Começar a calcular</button></div>`;
V.calcular = () => { const c = S.calc, r = calc(c), v = verdict(r);
  return `<div class="screen"><div class="top"><div class="brand"><i>KM</i>Certo</div><span class="chip">${tar().nome}</span></div>
  <div class="lcd"><div class="lb"><span>Valor da corrida</span><span>${veh().tipo === 'moto' ? 'MOTO' : 'CARRO'}</span></div><div class="big" data-g="888,88">${lcd(r.total)}</div><div class="mini"><div><b>${N(c.km)}</b><span>km</span></div><div><b>${c.min}</b><span>min</span></div><div><b style="color:${r.liq >= 0 ? '#b8ffd5' : '#ff9b9b'}">${N(r.liq, 2)}</b><span>líquido</span></div></div></div>
  <div class="inp" style="margin-top:14px"><label class="in"><small>Distância</small><input id="ckm" inputmode="decimal" value="${N(c.km).replace(',', '.')}"><u>km</u></label><label class="in"><small>Tempo</small><input id="cmin" inputmode="numeric" value="${c.min}"><u>min</u></label><label class="in"><small>Espera</small><input id="cesp" inputmode="numeric" value="${c.esp}"><u>min</u></label><label class="in"><small>Pedágio</small><input id="cped" inputmode="decimal" value="${c.ped}"><u>R$</u></label></div>
  <div class="tg"><b>Adicional noturno</b><button class="sw ${c.noturno ? 'on' : ''}" data-act="tg" data-v="noturno"></button></div><div class="tg"><b>Bandeira 2</b><button class="sw ${c.b2 ? 'on' : ''}" data-act="tg" data-v="b2"></button></div>
  <div class="card" style="padding:14px 16px"><div class="row sp"><b style="text-transform:uppercase;font-size:14px">Tarifa dinâmica</b><b class="mono" style="font-size:18px">× ${N(c.surge)}</b></div><input type="range" min="1" max="3" step="0.1" value="${c.surge}" id="csg" style="width:100%;accent-color:#16a85a;margin-top:8px"></div>
  <div class="verd ${v[0]}"><div class="ic">${v[1]}</div><div><h3>${v[2]}</h3><p class="sm" style="font-family:system-ui;margin-top:3px">${v[3]} <b>${R(r.porKm)}/km</b> • <b>${R(r.porHora)}/h</b></p></div></div>
  <div class="row"><button class="btn w" data-go="#/resultado">Ver detalhes</button><button class="btn g" data-act="salvar">Salvar corrida</button></div></div>${tabs('calcular')}`; };
V.resultado = () => { const c = S.calc, r = calc(c), v = verdict(r);
  return `<div class="screen">${back}<h1 style="font-size:26px;margin-bottom:14px">Detalhamento</h1><div class="lcd"><div class="lb"><span>Você cobra</span><span>${N(c.km)} km • ${c.min} min</span></div><div class="big" data-g="888,88" style="font-size:46px">${lcd(r.total)}</div></div>
  <p class="cap" style="margin:18px 0 6px">Composição da tarifa</p><div class="card">${[...r.lines, ...r.adds].map((l) => `<div class="ln"><span>${l[0]}</span><b>${R(l[1])}</b></div>`).join('')}${r.minAplic ? `<p class="sm mut" style="margin-top:6px;font-family:system-ui">Tarifa mínima de ${R(tar().minima)} aplicada.</p>` : ''}<div class="ln t"><span>Total</span><b>${R(r.total)}</b></div></div>
  <p class="cap" style="margin:18px 0 6px">Custos e comissão</p><div class="card"><div class="ln"><span>Combustível (${N(c.km / veh().consumo)} l)</span><b class="neg">− ${R(r.comb)}</b></div><div class="ln"><span>Manutenção (${R(veh().manut)}/km)</span><b class="neg">− ${R(r.manut)}</b></div><div class="ln"><span>Depreciação (${R(veh().deprec)}/km)</span><b class="neg">− ${R(r.dep)}</b></div>${c.fee ? `<div class="ln"><span>Comissão do app (${c.fee}%)</span><b class="neg">− ${R(r.fee)}</b></div>` : ''}<div class="ln t"><span>Lucro líquido</span><b class="${r.liq >= 0 ? 'pos' : 'neg'}">${R(r.liq)}</b></div></div>
  <div class="row" style="gap:10px;margin-bottom:12px"><div class="card grow" style="margin:0;text-align:center"><p class="cap">por km</p><b class="mono" style="font-size:22px">${R(r.porKm)}</b></div><div class="card grow" style="margin:0;text-align:center"><p class="cap">por hora</p><b class="mono" style="font-size:22px">${R(r.porHora)}</b></div><div class="card grow" style="margin:0;text-align:center"><p class="cap">margem</p><b class="mono" style="font-size:22px">${Math.round(r.liq / r.total * 100)}%</b></div></div><div class="verd ${v[0]}"><div class="ic">${v[1]}</div><div><h3>${v[2]}</h3><p class="sm" style="font-family:system-ui;margin-top:3px">${v[3]}</p></div></div><button class="btn g" data-act="salvar">Salvar corrida</button></div>`; };
V.oferta = () => { const o = V._o || (V._o = { val: 18.5, km: 7.2, min: 19, fee: 25 }); const c = { km: o.km, min: o.min, esp: 0, ped: 0, fee: o.fee }; const v = veh(); const comb = c.km / v.consumo * v.comb, custo = comb + c.km * (v.manut + v.deprec), liq = o.val * (1 - o.fee / 100) - custo, pk = liq / o.km, ph = liq / (o.min / 60); const m = S.meta; const vd = pk >= m.km && ph >= m.hora ? ['ok', '✓', 'Aceitar'] : liq <= 0 || (pk < m.km && ph < m.hora) ? ['no', '✕', 'Recusar'] : ['mid', '!', 'Avaliar'];

  switch (a) {
    case 'tp': S.tipo = v; S.ativo = v === 'moto' ? 1 : 0; S.tarAtiva = v === 'moto' ? 1 : 0; S.nome = document.getElementById('o-n').value; save(); render(); break;
    case 'start': { S.nome = document.getElementById('o-n').value.trim() || 'Motorista'; const vv = S.veic[S.ativo]; vv.consumo = num(document.getElementById('o-c').value) || vv.consumo; vv.comb = num(document.getElementById('o-p').value) || vv.comb; S.setup = true; save(); location.hash = '#/calcular'; break; }
    case 'tg': S.calc[v] = !S.calc[v]; save(); render(); break;
    case 'salvar': { const r = calc(S.calc); S.runs.push({ id: ++S.nid, at: Date.now(), km: S.calc.km, min: S.calc.min, valor: r.total, liq: r.liq, tipo: veh().tipo, app: S.calc.fee ? 'App' : 'Particular', tarifa: tar().nome }); save(); toast('Corrida salva'); location.hash = '#/corridas'; break; }
    case 'f': V._f = v; render(); break;
    case 'usar': S.tarAtiva = +v; save(); render(); break;
    case 'vat': S.ativo = +v; save(); render(); break;
    case 'newt': toast('Duplicando tarifa atual…'); S.tar.push({ ...tar(), nome: tar().nome + ' (cópia)' }); save(); render(); break;
    case 'edt': toast('Edição de tarifa disponível no app'); break;
    case 'tx': { const T = V._tx; if (!T.on) { T.on = true; T.t0 = Date.now(); T.t1 = Date.now(); T.km = 0; } else { T.km += (Date.now() - T.t1) / 3600000 * T.vel; const min = Math.max(1, Math.round((Date.now() - T.t0) / 60000)); const r = calc({ km: T.km, min, esp: 0, ped: 0, fee: 0 }); S.runs.push({ id: ++S.nid, at: Date.now(), km: Math.round(T.km * 10) / 10, min, valor: r.total, liq: r.liq, tipo: veh().tipo, app: 'Particular', tarifa: tar().nome }); T.min = min; T.on = false; save(); toast('Corrida registrada'); } render(); break; }
    case 'fee': S.calc.fee = +v; save(); render(); break;
    case 'fuel': S.fuel.push({ at: Date.now(), l: 30, p: veh().comb, posto: 'Posto local', cons: veh().consumo }); save(); toast('Abastecimento registrado'); render(); break;
    case 'msave': document.querySelectorAll('[data-meta]').forEach((i) => (S.meta[i.dataset.meta] = num(i.value))); save(); toast('Metas salvas'); break;
    case 'reset': if (confirm('Apagar todos os dados?')) { localStorage.removeItem('kmcerto.v1'); location.hash = ''; location.reload(); } break;
  }
});
window.appBack = function () { const h = location.hash; if (/^#\/(calcular|corridas|dia|tarifas|perfil|onboarding)?$/.test(h) || h === '') return false; history.back(); return true; };
if (!location.hash) location.hash = '#/calcular'; render();
})();
</script>

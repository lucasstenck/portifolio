<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<title>Vetor — entregas sob demanda</title>
<style>
:root{--bg:#0d1015;--s1:#141920;--s2:#1b212a;--s3:#232b36;--line:#2a3340;--tx:#eef2f7;--mut:#7f8b9b;--am:#ffb020;--am2:#e29400;--cy:#38d4f2;--ok:#3ddc97;--bad:#ff5d6c;--mono:"Cascadia Mono",Consolas,"SF Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
body{font-size:14.5px;line-height:1.4;overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}input,textarea,select{font:inherit;color:var(--tx)}p{margin:0}h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;overflow-y:auto;padding:16px 18px 110px}.screen::-webkit-scrollbar{display:none}
.mut{color:var(--mut)}.mono{font-family:var(--mono)}.sm{font-size:12px}.up{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.14em;text-transform:uppercase}.logo i{width:28px;height:28px;border:2px solid var(--am);border-radius:7px;display:grid;place-items:center;transform:rotate(45deg)}.logo i:after{content:"";width:8px;height:8px;background:var(--am);border-radius:2px}
.ib{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center}.ib svg{width:19px;height:19px;stroke:var(--tx);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;background:var(--am);color:#1a1100;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;width:100%}.btn:active{transform:scale(.985)}.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--line)}.btn.sm{height:38px;width:auto;padding:0 16px;font-size:12px;border-radius:10px}.btn:disabled{opacity:.35}.btn.cy{background:var(--cy);color:#04222a}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.map{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#10151b}
.stat{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.03em}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:7px;background:var(--s3);font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.tag.am{background:rgba(255,176,32,.14);color:var(--am)}.tag.ok{background:rgba(61,220,151,.13);color:var(--ok)}.tag.cy{background:rgba(56,212,242,.13);color:var(--cy)}.tag.bad{background:rgba(255,93,108,.13);color:var(--bad)}
.addr{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-bottom:14px}.addr .r{display:flex;align-items:center;gap:12px;padding:12px 0}.addr .r+.r{border-top:1px solid var(--line)}.dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--am);flex:none}.sq{width:12px;height:12px;border-radius:3px;background:var(--cy);flex:none}
.veh{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.vh{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;position:relative}.vh svg{width:40px;height:26px;stroke:var(--mut);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 6px;display:block}.vh b{display:block;font-size:12.5px}.vh small{font:600 11px var(--mono);color:var(--mut)}.vh.on{border-color:var(--am);background:rgba(255,176,32,.07)}.vh.on svg{stroke:var(--am)}.vh.on small{color:var(--am)}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;height:50px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:0}.field textarea{height:72px;padding:12px 14px}.field input:focus{border-color:var(--am)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 14px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mut)}.chip.on{border-color:var(--am);color:var(--am);background:rgba(255,176,32,.08)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.sw{width:46px;height:26px;border-radius:99px;background:var(--s3);position:relative;flex:none}.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.2s}.sw.on{background:var(--am)}.sw.on:after{left:23px;background:#1a1100}
.ln{display:flex;justify-content:space-between;padding:7px 0;color:var(--mut)}.ln b{color:var(--tx);font-family:var(--mono);font-weight:600}.ln.t{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;color:var(--tx)}.ln.t b{color:var(--am);font-size:22px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(13,16,21,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:20}.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mut);text-decoration:none;padding:5px 0}.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tabs a.on{color:var(--am)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px 100px}
.tl{margin-left:4px}.tl div{position:relative;padding:0 0 18px 28px}.tl div:before{content:"";position:absolute;left:5px;top:16px;bottom:-4px;width:1px;background:var(--line)}.tl div:last-child:before{display:none}.tl i{position:absolute;left:-1px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--s1);border:2px solid var(--line)}.tl .d i{background:var(--ok);border-color:var(--ok)}.tl .d:before{background:var(--ok)}.tl .c i{background:var(--am);border-color:var(--am);box-shadow:0 0 0 5px rgba(255,176,32,.18)}.tl small{display:block;color:var(--mut);font-family:var(--mono);font-size:11px}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;margin-bottom:8px;font-size:14px}.bubble.me{background:var(--am);color:#1a1100;margin-left:auto;border-bottom-right-radius:4px}.bubble.he{background:var(--s2);border-bottom-left-radius:4px}.bubble small{display:block;font:10.5px var(--mono);opacity:.65;margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:9px;height:130px}.bars div{flex:1;text-align:center;font:600 10.5px var(--mono);color:var(--mut)}.bars i{display:block;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--am),#7a5200);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--am);color:#1a1100;padding:11px 18px;border-radius:12px;font-weight:800;z-index:80}
.radar{width:210px;height:210px;border-radius:50%;margin:20px auto;position:relative;border:1px solid var(--line);background:radial-gradient(circle,transparent 30%,var(--line) 30.5%,transparent 31.5%,transparent 60%,var(--line) 60.5%,transparent 61.5%)}.radar:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,176,32,.35),transparent 25%);animation:sw 2.4s linear infinite}@keyframes sw{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}.seg button{padding:10px;border-radius:9px;font-weight:700;color:var(--mut);font-size:13px}.seg button.on{background:var(--s3);color:var(--tx)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const $app = document.getElementById('app');
const R = (n) => 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const PLACES = [['Armazém Central — Mooca', 'Rua da Mooca, 1840', 62, 58], ['Loja Pinheiros', 'Rua dos Pinheiros, 920', 24, 52], ['Escritório Faria Lima', 'Av. Brig. Faria Lima, 3477', 30, 72], ['CD Guarulhos', 'Rod. Hélio Smidt, km 4', 88, 14], ['Loja Moema', 'Av. Ibirapuera, 2907', 44, 84], ['Cliente — Vila Mariana', 'Rua Domingos de Morais, 410', 50, 62], ['Cliente — Tatuapé', 'Rua Tuiuti, 1220', 78, 48], ['Cliente — Santana', 'Av. Cruzeiro do Sul, 800', 60, 24], ['Cliente — Butantã', 'Av. Vital Brasil, 1500', 12, 56], ['Fábrica São Bernardo', 'Av. Kennedy, 700', 70, 96]];
const VEH = [['moto', 'Moto', 8, 1.9, 12, 20, 'M5 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0zM17 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0zM11 17h6l-3-7h-4M7 10h3', 'até 20 kg'], ['carro', 'Carro', 14, 2.8, 22, 150, 'M3 16V12l2-4h10l3 4h3v4M6 18a2 2 0 1 0 0 .1M18 18a2 2 0 1 0 0 .1M6 16h12', 'até 150 kg'], ['van', 'Van', 28, 4.2, 45, 800, 'M2 17V7h12v10M14 10h4l4 3v4M6 19a2 2 0 1 0 0 .1M18 19a2 2 0 1 0 0 .1M2 17h16', 'até 800 kg'], ['caminhao', 'Baú', 55, 6.9, 90, 3000, 'M2 17V6h13v11M15 9h4l3 4v4M6 19a2 2 0 1 0 0 .1M18 19a2 2 0 1 0 0 .1M2 17h20', 'até 3 t']];
const DRIVERS = [['Rogério Matos', 'moto', 'Honda CG 160 • FUK-4G21', 4.97, 3410], ['Daniela Freitas', 'carro', 'Fiat Argo • QRT-8B12', 4.93, 2188], ['Wellington Souza', 'van', 'Renault Master • BRA-2E19', 4.9, 1544], ['Cláudio Ribeiro', 'caminhao', 'VW Delivery • GHK-5J77', 4.88, 962]];
const IC = { box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', wal: '<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h12M16 14h3"/>', chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', back: '<path d="M15 5l-7 7 7 7"/>', chat: '<path d="M21 12a8 8 0 0 1-11.500 7.200L4 20l1-4.500A8 8 0 1 1 21 12z"/>', bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>', pin: '<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.500"/>' };
const ic = (n) => `<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
const vicon = (v) => `<svg viewBox="0 0 28 24" style="width:40px;height:26px"><path d="${VEH.find((x) => x[0] === v)[6]}"/></svg>`;
const tabs = (c) => `<nav class="tabs">${[['inicio', 'Enviar', 'box'], ['historico', 'Entregas', 'list'], ['carteira', 'Carteira', 'wal'], ['relatorios', 'Relatórios', 'chart'], ['perfil', 'Conta', 'user']].map(([k, l, i]) => `<a href="#/${k}" class="${c === k ? 'on' : ''}">${ic(i)}${l}</a>`).join('')}</nav>`;
const back = `<a class="ib" href="javascript:history.back()">${ic('back')}</a>`;

/* ---------- estado ---------- */
let S; try { S = JSON.parse(localStorage.getItem('vetor.v1')); } catch (e) { S = null; }
if (!S) S = { setup: false, empresa: '', cnpj: '', orders: [], draft: { from: 0, to: 5, veh: 'moto', peso: 5, tipo: 'Documentos', valor: 200, expresso: false, ajud: false, retorno: false, obs: '', quando: 'agora' }, saldo: 0, nid: 4200, chat: {}, rec: [] };
const save = () => { try { localStorage.setItem('vetor.v1', JSON.stringify(S)); } catch (e) {} };
const toast = (t) => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1800); };
const dist = (a, b) => { const A = PLACES[a], B = PLACES[b]; return Math.round((Math.abs(A[2] - B[2]) + Math.abs(A[3] - B[3])) * 0.17 * 10) / 10 + 1.2; };
function quote(d) {
  const v = VEH.find((x) => x[0] === d.veh), km = dist(d.from, d.to);
  const lines = [['Taxa base', v[2]], [`Distância (${km.toFixed(1).replace('.', ',')} km × ${R(v[3])})`, km * v[3]]];
  const pesoX = d.peso > v[5] * 0.6 ? (d.peso - v[5] * 0.6) * 0.12 : 0; if (pesoX) lines.push(['Adicional de peso', pesoX]);
  let sub = lines.reduce((a, l) => a + l[1], 0); sub = Math.max(sub, v[4]);
  const extra = []; if (d.expresso) extra.push(['Expresso (prioridade)', sub * 0.25]); if (d.ajud) extra.push(['Ajudante de carga', 35]); if (d.valor > 1000) extra.push(['Seguro da carga', d.valor * 0.004]);
  let tot = sub + extra.reduce((a, l) => a + l[1], 0); if (d.retorno) { extra.push(['Retorno ao ponto de origem', tot * 0.6]); tot *= 1.6; }
  const mins = Math.round(km * (d.veh === 'moto' ? 3.2 : d.veh === 'carro' ? 4 : 5) + 8);
  return { lines: [...lines, ...extra], total: Math.round(tot * 100) / 100, km, mins, minimo: sub === v[4] };
}
/* ---------- mapa ---------- */
function mapSvg(from, to, o = {}) {
  const A = PLACES[from], B = PLACES[to], ax = A[2] * 3.2 + 20, ay = A[3] * 2.1 + 14, bx = B[2] * 3.2 + 20, by = B[3] * 2.1 + 14;
  const pts = [[ax, ay], [ax, by], [bx, by]]; let tot = Math.abs(ay - by) + Math.abs(ax - bx), d = (o.f || 0) * tot, px = ax, py = ay;
  if (d <= Math.abs(ay - by)) { px = ax; py = ay + Math.sign(by - ay) * d; } else { px = ax + Math.sign(bx - ax) * (d - Math.abs(ay - by)); py = by; }
  const gridv = Array.from({ length: 20 }, (_, i) => `<path d="M${i * 22} 0V240" stroke="#1a222b" stroke-width="${i % 4 ? 1 : 2}"/>`).join(''), gridh = Array.from({ length: 12 }, (_, i) => `<path d="M0 ${i * 22}H460" stroke="#1a222b" stroke-width="${i % 4 ? 1 : 2}"/>`).join('');
  const others = PLACES.map((p, i) => `<circle cx="${p[2] * 3.2 + 20}" cy="${p[3] * 2.1 + 14}" r="3" fill="#2f3b49"/>`).join('');
  const prog = o.f ? `<polyline points="${pts.map((p) => p.join(',')).join(' ').split(' ').slice(0, 1).join('')} ${ax},${py > by !== by > ay ? by : py} ${px},${py}" fill="none" stroke="#ffb020" stroke-width="4"/>` : '';
  return `<svg viewBox="0 0 460 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="460" height="240" fill="#0f141a"/><path d="M0 170C90 150 150 190 260 140S400 120 460 150V240H0z" fill="#0f1c25"/>${gridv}${gridh}<path d="M0 60L460 150" stroke="#222c38" stroke-width="7"/><path d="M120 0L220 240" stroke="#222c38" stroke-width="6"/>${others}<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="#38d4f2" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${ax},${ay} ${ax},${Math.abs(py - ay) > 0 && Math.abs(px - ax) < 1 ? py : by} ${px !== ax ? px + ',' + by : ''}" fill="none" stroke="#ffb020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="${o.f ? 1 : 0}"/><circle cx="${ax}" cy="${ay}" r="9" fill="#0d1015" stroke="#ffb020" stroke-width="3"/><rect x="${bx - 8}" y="${by - 8}" width="16" height="16" rx="4" fill="#38d4f2"/>${o.f != null ? `<g transform="translate(${px} ${py})"><circle r="16" fill="#ffb020" opacity=".18"/><circle r="9" fill="#ffb020" stroke="#0d1015" stroke-width="3"/></g>` : ''}</svg>`;
}
const stageOf = (o) => { const f = (Date.now() - o.at) / (o.mins * 60000); return o.done || f >= 1 ? 4 : f < .05 ? 0 : f < .3 ? 1 : f < .45 ? 2 : 3; };
const STG = ['Buscando motorista', 'Motorista a caminho da coleta', 'Carga coletada', 'Em rota de entrega', 'Entrega concluída'];

/* ---------- telas ---------- */
const V = {};
V.login = () => `<div class="screen" style="padding-bottom:30px"><div style="margin:30px 0 40px"><div class="logo"><i></i>Vetor</div></div><p class="up">Logística sob demanda</p><h1 style="font-size:38px;line-height:1.02;margin:10px 0 14px">Qualquer carga.<br><span style="color:var(--am)">Qualquer hora.</span></h1><p class="mut" style="margin-bottom:28px;max-width:340px">Peça uma moto, carro, van ou caminhão baú em segundos, acompanhe em tempo real e receba o comprovante digital.</p>
<label class="field"><span>Empresa ou nome</span><input id="l-e" value="${S.empresa}" placeholder="Razão social ou seu nome"></label><label class="field"><span>CNPJ / CPF</span><input id="l-c" value="${S.cnpj}" placeholder="00.000.000/0000-00"></label><div style="height:10px"></div><button class="btn" data-act="login">Começar a enviar</button><p class="mut sm" style="text-align:center;margin-top:16px">Pagamento por fatura mensal ou cartão. Sem mensalidade.</p></div>`;
V.inicio = () => { const d = S.draft, act = S.orders.find((o) => stageOf(o) < 4);
  return `<div class="screen"><div class="hd"><div class="logo"><i></i>Vetor</div><div class="row"><a class="ib" href="#/historico">${ic('bell')}</a></div></div>
  ${act ? `<div class="card row" data-go="#/entrega/${act.id}" style="border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.06)"><div class="grow"><p class="up" style="color:var(--am)">Entrega em andamento</p><h3 style="margin-top:3px">${STG[stageOf(act)]}</h3><p class="mut sm mono">#${act.id} • ${PLACES[act.to][0]}</p></div><span class="tag am">Acompanhar</span></div>` : ''}
  <h1 style="font-size:26px;margin-bottom:12px">Para onde enviar?</h1><div class="map" style="height:200px;margin-bottom:14px">${mapSvg(d.from, d.to)}</div>
  <div class="addr"><div class="r" data-act="pick" data-v="from"><span class="dot"></span><div class="grow"><p class="up">Coleta</p><b>${PLACES[d.from][0]}</b><p class="mut sm">${PLACES[d.from][1]}</p></div><span class="mut">⌄</span></div><div class="r" data-act="pick" data-v="to"><span class="sq"></span><div class="grow"><p class="up">Entrega</p><b>${PLACES[d.to][0]}</b><p class="mut sm">${PLACES[d.to][1]}</p></div><span class="mut">⌄</span></div></div>
  <div class="row sp" style="margin-bottom:10px"><p class="up">Escolha o veículo</p><span class="mono sm mut">${dist(d.from, d.to).toFixed(1).replace('.', ',')} km • ~${quote(d).mins} min</span></div>
  <div class="veh">${VEH.map((v) => { const q = quote({ ...d, veh: v[0], retorno: false, expresso: false, ajud: false }); return `<button class="vh ${d.veh === v[0] ? 'on' : ''}" data-act="veh" data-v="${v[0]}">${vicon(v[0])}<b>${v[1]}</b><small>${R(q.total).replace('R$ ', '')}</small></button>`; }).join('')}</div>
  <div class="card row" style="padding:12px 14px"><div class="grow"><p class="up">Capacidade</p><b>${VEH.find((v) => v[0] === d.veh)[7]}</b></div><span class="tag">${d.veh === 'moto' ? 'Baú 40 L' : d.veh === 'carro' ? 'Porta-malas 400 L' : d.veh === 'van' ? '6 m³' : '24 m³'}</span></div>
  <button class="btn" data-go="#/carga">Continuar • ${R(quote(d).total)}</button></div>${tabs('inicio')}`; };
V.carga = () => { const d = S.draft;
  return `<div class="screen"><div class="hd">${back}<h2>Detalhes da carga</h2><span style="width:40px"></span></div><p class="up" style="margin-bottom:8px">Tipo de carga</p><div class="chips" style="margin-bottom:16px">${['Documentos', 'Encomenda', 'Alimentos', 'Eletrônicos', 'Móveis', 'Material de obra'].map((t) => `<button class="chip ${d.tipo === t ? 'on' : ''}" data-act="tipo" data-v="${t}">${t}</button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="field"><span>Peso aprox. (kg)</span><input id="pw" type="number" value="${d.peso}"></label><label class="field"><span>Valor declarado (R$)</span><input id="vl" type="number" value="${d.valor}"></label></div>

  save();
}
let route = '';
function render() {
  const h = (location.hash || '#/').replace(/^#\/?/, ''), [r, a] = h.split('/');
  if (r === 'exemplo') { seed(); location.replace('#/' + (a || 'inicio') + (location.hash.split('/')[3] ? '/' + location.hash.split('/')[3] : '')); return; }
  if (!S.setup && r !== 'login') { location.replace('#/login'); return; }
  const map = { login: V.login, inicio: V.inicio, carga: V.carga, cotacao: V.cotacao, buscando: () => V.buscando(a), entrega: () => V.entrega(a), chat: () => V.chat(a), comprovante: () => V.comprovante(a), historico: V.historico, carteira: V.carteira, relatorios: V.relatorios, enderecos: V.enderecos, recorrentes: V.recorrentes, perfil: V.perfil };
  const keep = route === h ? ($app.querySelector('.screen') || {}).scrollTop : 0;
  $app.innerHTML = (map[r] || V.inicio)(); route = h; const sc = $app.querySelector('.screen'); if (sc && keep) sc.scrollTop = keep;
}
window.addEventListener('hashchange', render); setInterval(() => { if (/^(entrega|buscando)/.test(route) && !document.activeElement.matches('input')) render(); }, 8000);
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) { const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go; return; }
  const a = t.dataset.act, v = t.dataset.v, d = S.draft;
  switch (a) {
    case 'login': { const x = document.getElementById('l-e').value.trim(); if (!x) return toast('Informe a empresa ou seu nome'); S.empresa = x; S.cnpj = document.getElementById('l-c').value; S.setup = true; save(); location.hash = '#/inicio'; break; }
    case 'pick': pickSheet(v); break;
    case 'veh': d.veh = v; save(); render(); break;
    case 'tipo': d.tipo = v; save(); render(); break;
    case 'tg': d[v] = !d[v]; save(); render(); break;
    case 'cot': d.peso = +document.getElementById('pw').value || 1; d.valor = +document.getElementById('vl').value || 0; d.obs = document.getElementById('ob').value; save(); location.hash = '#/cotacao'; break;
    case 'qd': d.quando = v; save(); render(); break;
    case 'pedir': { const q = quote(d), id = ++S.nid; S.orders.push({ id, from: d.from, to: d.to, veh: d.veh, total: q.total, km: q.km, mins: q.mins, at: Date.now(), done: false, rate: 0 }); save(); location.replace('#/buscando/' + id); break; }
    case 'cancel': S.orders = S.orders.filter((x) => x.id !== +v); save(); toast('Solicitação cancelada'); location.replace('#/inicio'); break;
    case 'send': { const i = document.getElementById('cm'); if (!i.value.trim()) return; (S.chat[+v] = S.chat[+v] || []).push(['me', i.value, Date.now()]); save(); render(); break; }
    case 'star': { const o = S.orders.find((x) => x.id === +location.hash.split('/')[2]); o.rate = +v + 1; save(); render(); break; }
    case 'repeat': { const o = S.orders.find((x) => x.id === +v); S.draft = { ...S.draft, from: o.from, to: o.to, veh: o.veh }; save(); location.hash = '#/inicio'; break; }
    case 'f': V._f = v; render(); break;
    case 'rec': S.saldo += +v; save(); toast(`+ ${R(+v)} adicionados`); render(); break;
    case 'reset': if (confirm('Apagar todos os dados?')) { localStorage.removeItem('vetor.v1'); location.hash = ''; location.reload(); } break;
  }
});
window.appBack = function () { const h = location.hash; if (/^#\/(inicio|historico|carteira|relatorios|perfil|login)?$/.test(h) || h === '') return false; history.back(); return true; };
if (!location.hash) location.hash = '#/inicio'; render();
})();
</script>

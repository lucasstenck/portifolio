<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f6efe3">
<title>Quitute — comida brasileira com entrega</title>
<style>
:root{--paper:#f6efe3;--paper2:#efe5d3;--card:#fffaf1;--ink:#2b2118;--mut:#85766a;--terra:#b8472a;--terra2:#9a3a21;--verde:#1f4d3a;--verde2:#2f6a50;--mostarda:#e0a526;--line:#e3d6bf;--ok:#2f7d4f;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
body{font-size:15px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}input,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em;margin:0}
p{margin:0}.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);background-image:repeating-linear-gradient(45deg,rgba(120,90,40,.025) 0 2px,transparent 2px 6px)}
.screen{flex:1;overflow-y:auto;padding:16px 18px 120px}.screen::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.loc small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}.loc b{font-family:Georgia,serif;font-size:17px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;position:relative;color:var(--ink)}.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.ib i{position:absolute;top:-4px;right:-4px;background:var(--terra);color:#fff;font:800 11px/1 sans-serif;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 4px;font-style:normal}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;height:48px;margin-bottom:18px}.search svg{width:19px;height:19px;stroke:var(--mut);fill:none;stroke-width:2}.search input{border:0;background:none;outline:0;flex:1;font-size:15px}
.hero{background:var(--verde);color:#f6efe3;border-radius:26px;padding:22px;position:relative;overflow:hidden;margin-bottom:22px}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:2px dashed rgba(246,239,227,.25)}.hero:after{content:"";position:absolute;right:20px;top:20px;width:80px;height:80px;border-radius:50%;background:var(--mostarda);opacity:.95}
.hero small{letter-spacing:.16em;text-transform:uppercase;font-weight:700;font-size:11px;color:var(--mostarda)}.hero h1{font-size:27px;line-height:1.1;margin:8px 0 6px;max-width:70%;position:relative;z-index:1}.hero p{opacity:.85;font-size:13.5px;max-width:72%;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:var(--terra);color:#fff;font-weight:800;font-size:16px;width:100%;letter-spacing:.01em;transition:.15s}.btn:active{transform:scale(.98)}.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.verde{background:var(--verde)}.btn.sm{height:38px;width:auto;padding:0 16px;font-size:13.5px;border-radius:11px}.btn:disabled{opacity:.4}
.hero .btn{width:auto;display:inline-flex;height:42px;padding:0 20px;background:var(--paper);color:var(--verde);font-size:14px;position:relative;z-index:1}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px}.sec h2{font-size:21px}.sec a{font-size:13px;color:var(--terra);font-weight:700;text-decoration:none}
.regs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px}.regs::-webkit-scrollbar{display:none}
.reg{flex:none;width:92px;text-align:center}.reg .em{width:92px;height:92px;border-radius:50% 50% 50% 8px;display:grid;place-items:center;margin-bottom:7px;position:relative;overflow:hidden}.reg b{font-size:13px;font-family:Georgia,serif}
.rest{display:flex;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.rest .ph{width:92px;height:92px;border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;position:relative}
.rest h3{font-size:17px}.meta{display:flex;gap:10px;font-size:12.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap;align-items:center}
.star{color:var(--mostarda);font-weight:800}.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--paper2);font-size:11.5px;font-weight:700;color:var(--verde)}.chip.t{background:#f5dccf;color:var(--terra2)}.chip.m{background:#f7e8bd;color:#7a5a00}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px}.pills::-webkit-scrollbar{display:none}.pill{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13.5px;color:var(--mut)}.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center}.back svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2.2}
.cover{height:190px;margin:-16px -18px 0;position:relative;display:grid;place-items:center;overflow:hidden}.cover .bk{position:absolute;left:18px;top:16px}
.rh{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:18px;margin:-34px 0 16px;position:relative}
.dish{display:flex;gap:12px;padding:14px 0;border-top:1.5px dashed var(--line)}.dish:first-of-type{border:0}.dish .ph{width:84px;height:84px;border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;position:relative}.dish h3{font-size:16px}.dish p{color:var(--mut);font-size:13px;margin:3px 0 8px}.price{font-family:Georgia,serif;font-weight:700;font-size:16px;color:var(--terra2)}
.add{width:34px;height:34px;border-radius:11px;background:var(--terra);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center;position:absolute;right:-6px;bottom:-6px;border:3px solid var(--card)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;width:calc(100% - 36px);max-width:484px;z-index:20}.fab .btn{justify-content:space-between;padding:0 20px;box-shadow:0 14px 30px -10px rgba(154,58,33,.7)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(246,239,227,.96);backdrop-filter:blur(12px);border-top:1.5px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:25}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);text-decoration:none;padding:5px 0}.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.tabs a.on{color:var(--terra)}
.sheet{position:fixed;inset:0;background:rgba(43,33,24,.55);z-index:40;display:flex;align-items:flex-end;max-width:520px;margin:0 auto}.sheet .in{width:100%;background:var(--paper);border-radius:28px 28px 0 0;padding:0 18px 22px;max-height:90%;overflow:auto}
.sheet .big{height:210px;margin:0 -18px 16px;display:grid;place-items:center;position:relative;overflow:hidden}.sheet .x{position:absolute;right:16px;top:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,250,241,.9);font-size:20px;display:grid;place-items:center}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1.5px dashed var(--line)}.opt .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px;flex:none}.opt.on .bx{background:var(--verde);border-color:var(--verde)}
.qty{display:flex;align-items:center;gap:14px}.qty button{width:38px;height:38px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-size:20px;font-weight:700}.qty b{font-family:Georgia,serif;font-size:20px;min-width:22px;text-align:center}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.line{display:flex;justify-content:space-between;padding:6px 0;color:var(--mut)}.line.t{color:var(--ink);font-weight:800;font-size:18px;font-family:Georgia,serif;border-top:1.5px dashed var(--line);margin-top:6px;padding-top:12px}
.cupom{display:flex;background:var(--card);border-radius:16px;margin-bottom:12px;position:relative;overflow:hidden;border:1.5px solid var(--line)}.cupom .l{background:var(--terra);color:#fff;width:96px;display:grid;place-items:center;text-align:center;padding:10px;font-family:Georgia,serif;font-weight:700;font-size:20px;line-height:1.05;position:relative}.cupom .l:after{content:"";position:absolute;right:-7px;top:0;bottom:0;width:14px;background:radial-gradient(circle at 7px 7px,var(--paper) 5px,transparent 5.5px) 0 0/14px 14px repeat-y}.cupom .r{padding:14px 16px;flex:1}
.pay{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);margin-bottom:8px;width:100%;text-align:left}.pay.on{border-color:var(--verde);box-shadow:inset 0 0 0 1px var(--verde);background:#f1f6f1}.pay .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}.pay.on .rd{border-color:var(--verde)}.pay.on .rd:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--verde)}
.tl{margin:6px 0 0 6px}.tl div{position:relative;padding:0 0 18px 30px}.tl div:before{content:"";position:absolute;left:6px;top:20px;bottom:-2px;width:2px;background:var(--line)}.tl div:last-child:before{display:none}.tl i{position:absolute;left:-3px;top:1px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:#fff;font-size:11px}.tl .d i{background:var(--verde);border-color:var(--verde)}.tl .d:before{background:var(--verde)}.tl .c i{background:var(--terra);border-color:var(--terra);box-shadow:0 0 0 5px #f1d3c7}
.map{height:230px;border-radius:24px;border:1.5px solid var(--line);overflow:hidden;margin:0 0 14px;background:#e8dfc9}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px}.field input,.field textarea{width:100%;height:50px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;outline:0}.field textarea{height:76px;padding:12px 14px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;z-index:80}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.ob{min-height:100%;display:flex;flex-direction:column}
.stamp{display:inline-block;border:2px solid var(--terra);color:var(--terra);padding:4px 12px;border-radius:8px;font:800 11px/1 sans-serif;letter-spacing:.14em;text-transform:uppercase;transform:rotate(-3deg)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const $app = document.getElementById('app');
const R = (n) => 'R$ ' + n.toFixed(2).replace('.', ',');
const REG = [['nordeste', 'Nordeste', '#c9632b', '#f2b45a'], ['minas', 'Minas', '#7a4b2a', '#e8c37c'], ['bahia', 'Bahia', '#c28a14', '#e25a2c'], ['sul', 'Sul', '#8e2f2f', '#d9a57a'], ['norte', 'Norte', '#2f6a50', '#bfd8a0'], ['centro', 'Centro-Oeste', '#a8742f', '#f0d089'], ['sudeste', 'Sudeste', '#5a3a2a', '#d7b07a']];
const regBy = Object.fromEntries(REG.map((r) => [r[0], r]));
const RESTS = [
  [1, 'Cozinha da Vó Zefa', 'nordeste', 'Baião de dois, carne de sol e macaxeira', 4.8, 412, 35, 5.9, 25, [['Carne de sol com macaxeira', 'Carne de sol desfiada na nata, macaxeira cozida e vinagrete de cebola roxa.', 46.9], ['Baião de dois com queijo coalho', 'Arroz e feijão-verde no ponto, queijo coalho maçaricado e manteiga de garrafa.', 38.5], ['Escondidinho de carne seca', 'Purê cremoso de macaxeira gratinado sobre carne seca desfiada.', 34.9], ['Galinha de capoeira ao molho pardo', 'Galinha caipira cozida lentamente, acompanha pirão e arroz.', 44.0], ['Cartola', 'Banana frita com queijo coalho, açúcar e canela.', 16.5]]],
  [2, 'Fogão Mineiro Tropeiro', 'minas', 'Feijão tropeiro, tutu e linguiça', 4.7, 356, 40, 6.5, 30, [['Feijão tropeiro completo', 'Feijão, farinha, bacon, linguiça, couve e ovo, servido com arroz.', 39.9], ['Tutu à mineira com bisteca', 'Tutu de feijão, bisteca suína grelhada, couve refogada e torresmo.', 48.5], ['Frango com quiabo', 'Frango caipira refogado com quiabo, angu e arroz branco.', 41.0], ['Pão de queijo (12 un.)', 'Receita da Serra, com queijo curado de Minas.', 18.9], ['Doce de leite com queijo', 'Fatia de queijo minas e doce de leite cremoso.', 14.9]]],
  [3, 'Casa do Acarajé Dendê', 'bahia', 'Acarajé, abará e moqueca baiana', 4.9, 689, 30, 4.9, 20, [['Acarajé completo', 'Massa de feijão-fradinho frita no dendê, vatapá, caruru, camarão e salada.', 19.9], ['Abará com camarão', 'Massa de feijão-fradinho cozida na folha de bananeira com dendê.', 16.5], ['Moqueca baiana de peixe', 'Peixe fresco, leite de coco, dendê, pimentões e coentro. Serve duas pessoas.', 89.9], ['Caruru com camarão seco', 'Quiabo, camarão seco, castanha e dendê.', 36.0], ['Cocada de forno', 'Cocada cremosa de coco queimado.', 12.0]]],
  [4, 'Galpão do Pampa', 'sul', 'Churrasco gaúcho e carreteiro', 4.6, 298, 45, 7.9, 40, [['Costela de fogo de chão', 'Costela bovina assada por 10 horas, farofa e vinagrete campeiro.', 62.0], ['Arroz carreteiro', 'Charque, arroz mal passado e temperos do pampa.', 36.9], ['Picanha na chapa (2 pessoas)', 'Picanha fatiada, batata rústica, farofa e molho chimichurri.', 118.0], ['Linguiça artesanal gaúcha', 'Linguiça suína curada na casa, com pão e mandioca.', 29.9], ['Pão de linguiça', 'Pão macio recheado com linguiça campeira.', 21.0]]],
  [5, 'Tacacá da Tia Nazaré', 'norte', 'Tacacá, maniçoba e pirarucu', 4.8, 187, 50, 8.9, 30, [['Tacacá tradicional', 'Tucupi, goma, jambu, camarão seco e pimenta de cheiro, servido quente.', 29.9], ['Maniçoba paraense', 'Folha de mandioca cozida por 7 dias com carnes defumadas.', 42.5], ['Pirarucu na brasa', 'Posta de pirarucu grelhada, farofa de ovo e vinagrete amazônico.', 67.0], ['Pato no tucupi', 'Pato desfiado cozido no tucupi com jambu e arroz.', 58.0], ['Sorvete de cupuaçu', 'Duas bolas de sorvete artesanal de cupuaçu.', 15.0]]],
  [6, 'Empório Goiano', 'centro', 'Empadão, pamonha e arroz com pequi', 4.5, 224, 38, 6.9, 25, [['Empadão goiano', 'Massa amanteigada recheada com frango, linguiça, queijo e guariroba.', 32.0], ['Arroz com pequi e frango', 'Arroz de pequi com frango caipira cozido.', 37.9], ['Pamonha salgada (3 un.)', 'Milho verde, queijo e pimenta, cozida na palha.', 17.5], ['Sopa de mandioquinha', 'Creme de mandioquinha com costelinha.', 27.0], ['Doce de buriti', 'Doce em calda de buriti com queijo.', 14.0]]],
  [7, 'Boteco Caipira', 'sudeste', 'Feijoada, virado à paulista e torresmo', 4.6, 502, 35, 5.5, 30, [['Feijoada completa (1 pessoa)', 'Feijão preto com carnes selecionadas, arroz, couve, farofa e laranja.', 44.9], ['Virado à paulista', 'Tutu de feijão, bisteca, linguiça, couve, banana frita e ovo.', 41.5], ['Torresmo de rolo', 'Porção de torresmo crocante com limão.', 26.0], ['Bolinho de feijoada (8 un.)', 'Bolinhos crocantes de feijoada com molho de pimenta.', 28.0], ['Pudim de leite', 'Pudim de leite condensado com calda de caramelo.', 13.5]]],
  [8, 'Tapiocaria Praia Bonita', 'nordeste', 'Tapiocas, cuscuz e beiju', 4.7, 301, 25, 3.9, 15, [['Tapioca de queijo coalho e carne de sol', 'Goma hidratada na hora, queijo coalho e carne de sol.', 24.9], ['Cuscuz com ovo e manteiga', 'Cuscuz nordestino de milho com ovo mexido e manteiga de garrafa.', 18.5], ['Tapioca de coco e leite condensado', 'Doce, coco ralado e leite condensado.', 14.9], ['Beiju de queijo', 'Beiju crocante com queijo derretido.', 16.0], ['Suco de cajá (500 ml)', 'Polpa natural, sem açúcar adicionado.', 9.9]]],
  [9, 'Moqueca & Cia', 'bahia', 'Moquecas capixaba e baiana', 4.8, 417, 42, 6.0, 35, [['Moqueca capixaba de badejo', 'Badejo, tomate, cebola, urucum e coentro na panela de barro.', 84.0], ['Moqueca de banana-da-terra', 'Versão vegetariana com banana-da-terra e leite de coco.', 52.0], ['Bobó de camarão', 'Creme de mandioca, camarão, dendê e leite de coco.', 68.5], ['Pirão de peixe', 'Pirão cremoso feito com caldo da moqueca.', 12.0], ['Torta capixaba (fatia)', 'Torta de mariscos e palmito, receita tradicional.', 31.0]]],
  [10, 'Padaria da Serra', 'minas', 'Pão de queijo, broa e café coado', 4.7, 263, 20, 3.5, 12, [['Cesta de pão de queijo (20 un.)', 'Quentinhos, saem do forno a cada 30 minutos.', 29.9], ['Broa de milho (6 un.)', 'Broa de fubá com erva-doce.', 16.0], ['Café coado com leite (350 ml)', 'Café de torra média coado na hora.', 8.5], ['Bolo de fubá cremoso (fatia)', 'Fubá, leite e queijo parmesão.', 9.9], ['Queijo minas padrão (500 g)', 'Queijo fresco artesanal da Serra da Canastra.', 34.0]]],
];
const DIS = []; RESTS.forEach((r) => r[9].forEach((d, i) => DIS.push({ id: r[0] * 10 + i, rid: r[0], n: d[0], d: d[1], p: d[2] })));
const dBy = Object.fromEntries(DIS.map((d) => [d.id, d])); const rBy = Object.fromEntries(RESTS.map((r) => [r[0], r]));
const EXTRAS = [['Farofa da casa', 4], ['Vinagrete', 3], ['Pimenta artesanal', 0], ['Pão de queijo (4 un.)', 7.5], ['Suco natural 300 ml', 8]];

/* ilustração procedural de prato: nada de emoji, tudo SVG desenhado a partir de uma semente */
function plate(seed, h1, h2, s = 100) {
  let x = (seed * 9301 + 49297) % 233280; const rnd = () => ((x = (x * 9301 + 49297) % 233280) / 233280);
  const cols = [h1, h2, '#f4e3bd', '#6b8f3a', '#c24a22'];
  let blobs = '';
  for (let i = 0; i < 7; i++) { const a = rnd() * 6.28, d = rnd() * 26, cx = 60 + Math.cos(a) * d, cy = 60 + Math.sin(a) * d, rx = 9 + rnd() * 13, ry = 7 + rnd() * 10, c = cols[Math.floor(rnd() * cols.length)];
    blobs += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${c}" transform="rotate(${Math.floor(rnd() * 180)} ${cx.toFixed(1)} ${cy.toFixed(1)})"/><ellipse cx="${(cx - 2).toFixed(1)}" cy="${(cy - 2).toFixed(1)}" rx="${(rx * .5).toFixed(1)}" ry="${(ry * .4).toFixed(1)}" fill="#fff" opacity=".16"/>`; }
  let herb = ''; for (let i = 0; i < 9; i++) herb += `<circle cx="${(44 + rnd() * 32).toFixed(1)}" cy="${(44 + rnd() * 32).toFixed(1)}" r="${(1 + rnd() * 1.6).toFixed(1)}" fill="#3f6b2c"/>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 120 120"><ellipse cx="62" cy="68" rx="52" ry="48" fill="rgba(60,40,20,.18)"/><circle cx="60" cy="60" r="52" fill="#fffdf8"/><circle cx="60" cy="60" r="52" fill="none" stroke="#e8dcc4" stroke-width="2"/><circle cx="60" cy="60" r="40" fill="#f7f0e1" stroke="#eadfc7"/>${blobs}${herb}</svg>`;
}
const bg = (r) => `background:radial-gradient(circle at 30% 25%,${regBy[r][3]}33,transparent 60%),${regBy[r][2]}1f`;
const dishPh = (d, s) => `<div class="ph" style="${bg(rBy[d.rid][2])}">${plate(d.id, regBy[rBy[d.rid][2]][2], regBy[rBy[d.rid][2]][3], s)}</div>`;

/* ---------- estado ---------- */
let S; try { S = JSON.parse(localStorage.getItem('quitute.v1')); } catch (e) { S = null; }
if (!S) S = { setup: false, name: '', addr: { rua: '', num: '', bairro: '', cidade: 'São Paulo' }, addrs: [], cart: { rid: 0, items: [] }, orders: [], fav: [], coupon: '', pay: 'pix', nid: 1000 };
const save = () => { try { localStorage.setItem('quitute.v1', JSON.stringify(S)); } catch (e) {} };
const toast = (t) => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1800); };

}

V.favoritos = () => `<div class="screen"><h1 style="font-size:28px;margin-bottom:14px">Favoritos</h1>${S.fav.map((id) => restCard(rBy[id])).join('') || '<div class="empty">Toque no coração de um restaurante para salvá-lo aqui.</div>'}</div>${tabs('favoritos')}`;
V.cupons = () => `<div class="screen"><div class="top">${backBtn}<h2 class="serif">Cupons</h2><span style="width:40px"></span></div><label class="field"><span>Tem um código?</span><div class="row"><input id="cc" placeholder="Digite o cupom" style="text-transform:uppercase"><button class="btn sm verde" data-act="cc">Aplicar</button></div></label>${Object.entries(COUPONS).map(([k, c]) => `<div class="cupom"><div class="l">${c[0]}</div><div class="r"><h3 style="font-size:15px">${k}</h3><p class="sm mut" style="margin:3px 0 10px">${c[1]}</p><button class="btn sm ${S.coupon === k ? 'alt' : ''}" data-act="cp" data-v="${k}">${S.coupon === k ? 'Aplicado ✓' : 'Usar cupom'}</button></div></div>`).join('')}</div>`;
V.enderecos = () => `<div class="screen"><div class="top">${backBtn}<h2 class="serif">Endereços</h2><span style="width:40px"></span></div>${[S.addr, ...S.addrs].map((a, i) => `<div class="pay ${i === 0 ? 'on' : ''}" data-act="useaddr" data-v="${i}"><span class="rd"></span><div class="grow"><b>${i === 0 ? 'Casa' : 'Trabalho'}</b><p class="sm mut">${a.rua}${a.num ? ', ' + a.num : ''} • ${a.bairro}, ${a.cidade}</p></div></div>`).join('')}<button class="btn alt" style="margin-top:10px">+ Adicionar novo endereço</button></div>`;
V.perfil = () => `<div class="screen"><div class="row" style="margin-bottom:20px"><div style="width:68px;height:68px;border-radius:50% 50% 50% 10px;background:var(--terra);color:#fff;display:grid;place-items:center;font:700 28px Georgia,serif">${(S.name || 'Q')[0].toUpperCase()}</div><div><h1 style="font-size:24px">${S.name || 'Visitante'}</h1><p class="mut">${S.orders.length} pedidos • ${S.fav.length} favoritos</p></div></div>
  <div class="card" style="background:var(--verde);color:#f6efe3;border:0"><span class="stamp" style="color:var(--mostarda);border-color:var(--mostarda)">Clube Quitute</span><h3 class="serif" style="font-size:22px;margin:10px 0 4px">${S.orders.length * 40} pontos</h3><p class="sm" style="opacity:.85">A cada R$ 10 em pedidos você ganha 1 ponto. 200 pontos valem R$ 20.</p><div style="height:8px;border-radius:8px;background:rgba(255,255,255,.2);margin-top:12px"><div style="height:100%;width:${Math.min(100, S.orders.length * 40 / 2)}%;background:var(--mostarda);border-radius:8px"></div></div></div>
  ${[['🎟️', 'Cupons', '#/cupons'], ['📍', 'Endereços', '#/enderecos'], ['❤️', 'Favoritos', '#/favoritos'], ['🧾', 'Histórico de pedidos', '#/pedidos']].map(([e, t, h]) => `<div class="card row" style="padding:14px" data-go="${h}"><span style="font-size:22px">${e}</span><h3 class="grow" style="font-size:15px;font-family:inherit">${t}</h3><span class="mut">›</span></div>`).join('')}<button class="btn alt" style="margin-top:8px;color:var(--terra)" data-act="reset">Sair e apagar dados</button><p class="mut sm" style="text-align:center;margin-top:16px">Quitute 1.0 • feito com sabor</p></div>${tabs('perfil')}`;

/* ---------- ações ---------- */
function dishSheet(id) {
  const d = dBy[id], r = rBy[d.rid]; let q = 1, sel = new Set(), obs = '';
  const el = document.createElement('div'); el.className = 'sheet';
  const price = () => (d.p + [...sel].reduce((a, i) => a + EXTRAS[i][1], 0)) * q;
  const paint = () => { el.innerHTML = `<div class="in"><div class="big" style="${bg(r[2])};background-color:${regBy[r[2]][2]}22"><button class="x" data-c>×</button>${plate(d.id, regBy[r[2]][2], regBy[r[2]][3], 190)}</div><h1 style="font-size:24px">${d.n}</h1><p class="mut" style="margin:6px 0 4px">${d.d}</p><p class="price" style="font-size:20px">${R(d.p)}</p><h3 class="serif" style="margin:18px 0 4px">Acompanhamentos</h3>${EXTRAS.map((e, i) => `<div class="opt ${sel.has(i) ? 'on' : ''}" data-e="${i}"><span class="bx">${sel.has(i) ? '✓' : ''}</span><b class="grow" style="font-weight:600">${e[0]}</b><span class="mut">${e[1] ? '+ ' + R(e[1]) : 'Grátis'}</span></div>`).join('')}<label class="field" style="margin-top:14px"><span>Alguma observação?</span><textarea id="ob" placeholder="Ex.: sem cebola, ponto da carne…">${obs}</textarea></label><div class="row sp"><div class="qty"><button data-q="-1">−</button><b>${q}</b><button data-q="1">+</button></div><button class="btn" style="width:auto;flex:1;margin-left:16px" data-ok>Adicionar • ${R(price())}</button></div></div>`; };
  paint(); document.body.appendChild(el);
  el.addEventListener('click', (e) => {
    if (e.target === el || e.target.closest('[data-c]')) return el.remove();
    const ex = e.target.closest('[data-e]'); if (ex) { obs = el.querySelector('#ob').value; const i = +ex.dataset.e; sel.has(i) ? sel.delete(i) : sel.add(i); paint(); }
    const qq = e.target.closest('[data-q]'); if (qq) { obs = el.querySelector('#ob').value; q = Math.max(1, q + +qq.dataset.q); paint(); }
    if (e.target.closest('[data-ok]')) { obs = el.querySelector('#ob').value; if (S.cart.rid && S.cart.rid !== d.rid && S.cart.items.length && !confirm('Seu carrinho tem itens de outro restaurante. Deseja esvaziá-lo e começar um novo pedido?')) return;
      if (S.cart.rid !== d.rid) S.cart = { rid: d.rid, items: [] }; S.cart.items.push({ did: d.id, q, price: d.p + [...sel].reduce((a, i) => a + EXTRAS[i][1], 0), extras: [...sel].map((i) => EXTRAS[i][0]), obs }); save(); el.remove(); toast(`${d.n} adicionado`); render(); }
  });
}
function seed() {
  const A = { rua: 'Rua das Palmeiras', num: '248', bairro: 'Vila Madalena', cidade: 'São Paulo' };
  S = { setup: true, name: 'Marina Albuquerque', addr: A, addrs: [{ rua: 'Av. Paulista', num: '1578', bairro: 'Bela Vista', cidade: 'São Paulo' }], cart: { rid: 0, items: [] }, orders: [], fav: [3, 1, 8], coupon: '', pay: 'pix', nid: 1040 };
  const mk = (rid, di, q, ago, eta, id) => { const items = di.map((d, k) => ({ n: dBy[rid * 10 + d].n, q: q[k], price: dBy[rid * 10 + d].p })); const sub = items.reduce((a, i) => a + i.price * i.q, 0); return { id, rid, items, total: sub + rBy[rid][7], at: Date.now() - ago * 60000, eta, pay: 'pix', done: ago > eta }; };
  S.orders.push(mk(2, [0, 3], [1, 1], 4320, 40, 1021), mk(8, [0, 1, 4], [1, 1, 2], 20160, 25, 1012), mk(9, [2, 3], [1, 1], 10080, 42, 1018), mk(3, [0, 2], [2, 1], 22, 35, 1039));
  S.cart = { rid: 1, items: [{ did: 10, q: 1, price: 50.9, extras: ['Farofa da casa', 'Pimenta artesanal'], obs: 'Carne bem passada, por favor' }, { did: 12, q: 1, price: 34.9, extras: [], obs: '' }, { did: 14, q: 2, price: 16.5, extras: [], obs: '' }] };
  S.coupon = 'QUITUTE10'; save();
}
let route = '';
function render() {
  const h = (location.hash || '#/').replace(/^#\/?/, ''), [r, a] = h.split('/');
  if (r === 'exemplo') { seed(); location.replace('#/' + (a || 'inicio')); return; }
  if (!S.setup && r !== 'bem-vindo') { location.replace('#/bem-vindo'); return; }
  const map = { 'bem-vindo': V.onboarding, inicio: V.inicio, regiao: () => V.regiao(a), busca: V.busca, loja: () => V.loja(a), carrinho: V.carrinho, checkout: V.checkout, pedido: () => V.pedido(a), pedidos: V.pedidos, favoritos: V.favoritos, cupons: V.cupons, enderecos: V.enderecos, perfil: V.perfil };
  const keep = route === h ? ($app.querySelector('.screen') || {}).scrollTop : 0;
  $app.innerHTML = (map[r] || V.inicio)(); route = h; const sc = $app.querySelector('.screen'); if (sc && keep) sc.scrollTop = keep;
  const q = document.getElementById('q'); if (q) q.oninput = () => { V._q = q.value; const t = q.value.toLowerCase(), g = V._g || 'todos'; document.getElementById('bl').innerHTML = RESTS.filter((x) => (g === 'todos' || x[2] === g) && (!t || (x[1] + x[3] + x[9].map((d) => d[0]).join(' ')).toLowerCase().includes(t))).map(restCard).join('') || '<div class="empty">Nada encontrado.</div>'; };
}
window.addEventListener('hashchange', render); setInterval(() => { if (/^(pedido|inicio)/.test(route) && !document.querySelector('.sheet')) render(); }, 20000);
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) { const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go; return; }
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'start': { const g = (i) => document.getElementById(i).value.trim(); if (!g('o-n') || !g('o-r')) return toast('Informe seu nome e o endereço'); const m = g('o-r').match(/^(.*?)[,\s]+(\d+\w*)$/); S.name = g('o-n'); S.addr = { rua: m ? m[1] : g('o-r'), num: m ? m[2] : '', bairro: g('o-b') || 'Centro', cidade: g('o-c') || 'São Paulo' }; S.setup = true; save(); location.hash = '#/inicio'; break; }
    case 'g': V._g = v; render(); break;
    case 'dish': dishSheet(+v); break;
    case 'fav': { const i = S.fav.indexOf(+v); i >= 0 ? S.fav.splice(i, 1) : S.fav.push(+v); save(); render(); break; }
    case 'q': { const it = S.cart.items[+t.dataset.i]; it.q += +t.dataset.d; if (it.q <= 0) S.cart.items.splice(+t.dataset.i, 1); if (!S.cart.items.length) S.cart.rid = 0; save(); render(); break; }
    case 'clear': S.cart = { rid: 0, items: [] }; save(); render(); break;
    case 'cp': S.coupon = S.coupon === v ? '' : v; save(); toast(S.coupon ? 'Cupom aplicado' : 'Cupom removido'); render(); break;
    case 'cc': { const c = document.getElementById('cc').value.trim().toUpperCase(); if (!COUPONS[c]) return toast('Cupom inválido'); S.coupon = c; save(); toast('Cupom aplicado'); render(); break; }
    case 'pay': S.pay = v; save(); render(); break;
    case 'useaddr': { const all = [S.addr, ...S.addrs]; const x = all.splice(+v, 1)[0]; all.unshift(x); S.addr = all[0]; S.addrs = all.slice(1); save(); history.back(); break; }
    case 'order': { const r = rBy[S.cart.rid], tt = totals(); const o = { id: ++S.nid, rid: r[0], items: S.cart.items.map((i) => ({ n: dBy[i.did].n, q: i.q, price: i.price })), total: tt.total, at: Date.now(), eta: r[6], pay: S.pay }; S.orders.push(o); S.cart = { rid: 0, items: [] }; S.coupon = ''; save(); location.replace('#/pedido/' + o.id); toast('Pedido enviado para a cozinha!'); break; }
    case 'again': { const o = S.orders.find((x) => x.id === +v); S.cart = { rid: o.rid, items: o.items.map((i) => { const d = DIS.find((x) => x.rid === o.rid && x.n === i.n); return { did: d.id, q: i.q, price: i.price, extras: [], obs: '' }; }) }; save(); location.hash = '#/carrinho'; break; }
    case 'reset': if (confirm('Apagar todos os dados do aplicativo?')) { localStorage.removeItem('quitute.v1'); location.hash = ''; location.reload(); } break;
  }
});
window.appBack = function () { const h = location.hash; if (/^#\/(inicio|busca|pedidos|favoritos|perfil|bem-vindo)?$/.test(h) || h === '') return false; history.back(); return true; };
if (!location.hash) location.hash = '#/inicio'; render();
})();
</script>

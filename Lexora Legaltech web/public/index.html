<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lexora — plataforma jurídica com inteligência artificial</title>
<meta name="description" content="Gestão de clientes, processos, prazos e documentos com IA para escritórios de advocacia. 30 dias grátis.">
<style>
:root{--ink:#15131a;--ink2:#221f2b;--paper:#fbf9f5;--sand:#ece5d6;--sand2:#f4efe4;--line:#ddd5c4;--mut:#7a7466;--ox:#7a1f3d;--ox2:#5e1630;--ox3:#f3dde4;--gold:#b88a3e;--ok:#2d7a4f;--warn:#b7791f;--bad:#b3261e;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;margin:0;line-height:1.1}h1 i,h2 i{font-style:italic;color:var(--ox)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}.sm{font-size:12.5px}.mut{color:var(--mut)}.up{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;background:var(--ink);color:#fff;font-weight:600;font-size:14.5px;border-radius:4px;text-decoration:none;transition:.15s;border:1px solid var(--ink)}.btn:hover{background:var(--ox);border-color:var(--ox)}.btn.o{background:transparent;color:var(--ink)}.btn.o:hover{background:var(--ink);color:#fff}.btn.ox{background:var(--ox);border-color:var(--ox)}.btn.ox:hover{background:var(--ox2)}.btn.sm{padding:7px 14px;font-size:13px}.btn.red{background:transparent;color:var(--bad);border-color:#e7c3bf}.btn:disabled{opacity:.5;cursor:wait}.btn.block{width:100%}
/* landing */
.lh{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:30}.lh .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}.logo{font-family:var(--serif);font-size:27px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:10px}.logo svg{width:24px;height:24px}.logo b{font-weight:400;color:var(--ox)}
.lh nav{display:flex;gap:30px}.lh nav a{text-decoration:none;font-size:14px;color:var(--mut)}.lh nav a:hover{color:var(--ink)}
.hero{padding:90px 0 70px;border-bottom:1px solid var(--line)}.hero .g{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}.hero h1{font-size:clamp(44px,6.4vw,84px);margin:18px 0 24px}.hero p.l{font-size:19px;color:#4b4658;max-width:540px;margin:0 0 32px}
.mock{background:var(--ink);border-radius:10px;padding:12px;box-shadow:0 40px 80px -30px rgba(21,19,26,.5);transform:rotate(1.2deg)}.mock .bar{display:flex;gap:6px;padding:4px 6px 12px}.mock .bar i{width:9px;height:9px;border-radius:50%;background:#3a3645}.mock .in{background:var(--paper);border-radius:6px;padding:20px;min-height:330px}.mock .k{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.mock .k div{border:1px solid var(--line);padding:10px 12px;border-radius:4px}.mock .k b{display:block;font:400 26px var(--serif)}.mock .k span{font-size:10.5px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}.mock .ln{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.strip div{padding:26px 24px;border-right:1px solid var(--line)}.strip div:last-child{border:0}.strip b{display:block;font:400 22px var(--serif);margin-bottom:4px}.strip span{font-size:13.5px;color:var(--mut)}
section.s{padding:90px 0;border-bottom:1px solid var(--line)}.sh{max-width:680px;margin-bottom:48px}.sh h2{font-size:clamp(34px,4.4vw,56px);margin:14px 0 16px}.sh p{color:#4b4658;font-size:17px;margin:0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}.feat div{padding:30px 28px 34px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}.feat div:nth-child(3n){border-right:0}.feat div:nth-last-child(-n+3){border-bottom:0}.feat span{font:400 13px var(--serif);color:var(--ox);font-style:italic}.feat h3{font-size:23px;margin:12px 0 10px}.feat p{margin:0;color:#4b4658;font-size:15px}
.ai{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}.ai ul{list-style:none;padding:0;margin:26px 0 0}.ai li{padding:15px 0;border-top:1px solid var(--line);display:flex;gap:14px}.ai li b{font:400 18px var(--serif);min-width:150px}.ai li span{color:#4b4658;font-size:14.5px}
.doc{background:#fff;border:1px solid var(--line);border-radius:4px;padding:26px 28px;box-shadow:0 30px 60px -34px rgba(21,19,26,.45);font-family:var(--serif);font-size:14.5px;line-height:1.65}.doc .tag{display:inline-block;background:var(--ox3);color:var(--ox);font:600 10.5px "Inter",sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:2px;margin-bottom:14px}.doc mark{background:#f6e6b4;padding:0 2px}
.price{max-width:520px;margin:0 auto;background:var(--ink);color:#fff;border-radius:6px;padding:44px 40px;text-align:center}.price .v{font:400 76px var(--serif);letter-spacing:-.04em;line-height:1;margin:14px 0 4px}.price .v small{font-size:20px;color:#b6b0c2}.price ul{list-style:none;padding:0;margin:26px 0 30px;text-align:left}.price li{padding:11px 0;border-top:1px solid #3a3645;color:#d9d4e2;font-size:14.5px}.price li:before{content:"✓";color:var(--gold);margin-right:10px;font-weight:700}
details{border-top:1px solid var(--line)}details:last-child{border-bottom:1px solid var(--line)}summary{list-style:none;cursor:pointer;font:400 24px var(--serif);padding:24px 0;display:flex;justify-content:space-between;letter-spacing:-.01em}summary::-webkit-details-marker{display:none}summary:after{content:"+";font-size:28px;color:var(--ox)}details[open] summary:after{content:"–"}details p{margin:0 0 24px;max-width:700px;color:#4b4658}
.lf{padding:54px 0;font-size:13.5px;color:var(--mut)}.lf .wrap{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth .l{background:var(--ink);color:#fff;padding:50px 60px;display:flex;flex-direction:column;justify-content:space-between}.auth .l h2{font-size:46px;margin:0 0 18px}.auth .l h2 i{color:#d9a0b4}.auth .l p{color:#b6b0c2;max-width:420px}.auth .r{padding:50px 60px;display:flex;align-items:center}.auth form{width:100%;max-width:420px}
.f{margin-bottom:16px}.f label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#4b4658}.f input,.f select,.f textarea{width:100%;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:4px;outline:0;font-size:15px}.f textarea{min-height:110px;resize:vertical;line-height:1.5}.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ox);box-shadow:0 0 0 3px var(--ox3)}.f .er{display:none;color:var(--bad);font-size:12.5px;margin-top:5px}.f.bad input,.f.bad select{border-color:var(--bad)}.f.bad .er{display:block}.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chk{display:flex;gap:10px;font-size:13px;color:#4b4658;margin:6px 0 18px}.chk input{margin-top:3px;accent-color:var(--ox)}
/* app */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--ink);color:#d9d4e2;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.side .logo{color:#fff;padding:0 10px 22px}.side .logo b{color:#d9a0b4}.side .off{padding:12px;background:#221f2b;border-radius:6px;margin-bottom:16px}.side .off b{display:block;font:400 16px var(--serif);color:#fff}.side .off span{font-size:11.5px;color:#9f98ae}
.side a.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:5px;text-decoration:none;font-size:14.5px;color:#b6b0c2;margin-bottom:2px}.side a.nv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.side a.nv:hover{background:#221f2b;color:#fff}.side a.nv.on{background:var(--ox);color:#fff}.side .me{margin-top:auto;padding:12px;border-top:1px solid #2f2b3a;font-size:13px}.side .me b{color:#fff;display:block}
.main{padding:28px 38px 80px;max-width:1240px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.top h1{font-size:40px}.top p{margin:6px 0 0;color:var(--mut)}
.gs{position:relative;width:340px}.gs input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:4px;background:#fff;outline:0}.gs input:focus{border-color:var(--ox)}.gs .dd{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 20px 40px -16px rgba(21,19,26,.3);z-index:20}.gs .dd div{padding:11px 14px;border-bottom:1px solid var(--line2,#eee);cursor:pointer;font-size:14px}.gs .dd div:hover{background:var(--sand2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.kpi{background:#fff;border:1px solid var(--line);padding:18px 20px;border-radius:5px}.kpi b{display:block;font:400 40px var(--serif);letter-spacing:-.03em;line-height:1.1;margin-top:6px}.kpi span.s{font-size:12.5px;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:5px;margin-bottom:18px}.card .h{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card .h h3{font-size:21px}.card .b{padding:18px 22px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.banner{background:var(--ox3);border:1px solid #e3bccb;border-radius:5px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.banner.warn{background:#fff4dc;border-color:#ecd49a}
table{width:100%;border-collapse:collapse;font-size:14.5px}th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:11px 22px;border-bottom:1px solid var(--line);font-weight:600;background:var(--sand2)}td{padding:14px 22px;border-bottom:1px solid #eee7d8;vertical-align:middle}tr:last-child td{border:0}tr.c{cursor:pointer}tr.c:hover td{background:var(--sand2)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sand);color:#5a5547}.pill.ok{background:#dcefe3;color:var(--ok)}.pill.w{background:#faecc7;color:var(--warn)}.pill.b{background:#f6d9d6;color:var(--bad)}.pill.o{background:var(--ox3);color:var(--ox)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:22px}.tabs button{padding:10px 0;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--ox);border-color:var(--ox)}
.mv{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid #eee7d8}.mv:last-child{border:0}.mv time{font:500 12.5px "Cascadia Mono",monospace;color:var(--mut);min-width:84px;padding-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);background:#fff}.cal .hd{padding:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);background:var(--sand2);border-bottom:1px solid var(--line);font-weight:600}.cal .d{min-height:104px;padding:8px;border-right:1px solid #eee7d8;border-bottom:1px solid #eee7d8;font-size:12.5px}.cal .d:nth-child(7n){border-right:0}.cal .d.off{background:#faf8f3;color:#b9b2a2}.cal .d.today b{background:var(--ox);color:#fff;border-radius:50%;padding:1px 7px}.cal .ev{display:block;margin-top:4px;padding:3px 7px;border-radius:3px;font-size:11.5px;background:var(--ox3);color:var(--ox2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--ox)}.cal .ev.aud{background:#e4ecf8;color:#1d4a85;border-color:#2b5b9a}.cal .ev.t{background:var(--sand);color:#5a5547;border-color:var(--gold)}
.bars{display:flex;align-items:flex-end;gap:16px;height:160px;padding-top:10px}.bars div{flex:1;text-align:center;font-size:11.5px;color:var(--mut)}.bars i{display:block;border-radius:3px 3px 0 0;margin:0 auto 6px;width:38%;display:inline-block;vertical-align:bottom}
.ia{display:grid;grid-template-columns:1fr 1fr;gap:18px}.out{background:#fff;border:1px solid var(--line);border-radius:5px;padding:24px 26px;font-family:var(--serif);font-size:15.5px;line-height:1.7;white-space:pre-wrap;min-height:360px}.rev{background:#fff4dc;border:1px solid #ecd49a;color:#7a5a12;padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:14px}
.fld{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:12px 0;border-top:1px solid #eee7d8}.fld:first-child{border:0}.fld b{font-size:13px;color:#4b4658}.fld span.v{display:inline-block;background:var(--sand2);border:1px solid var(--line);padding:2px 9px;border-radius:3px;margin:0 6px 6px 0;font:500 13px "Cascadia Mono",monospace}
.modal{position:fixed;inset:0;background:rgba(21,19,26,.55);z-index:60;display:grid;place-items:center;padding:20px;overflow:auto}.dlg{background:var(--paper);border-radius:6px;padding:30px;width:100%;max-width:560px;margin:auto}.dlg h2{font-size:30px;margin-bottom:20px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:14px 22px;border-radius:5px;z-index:90;border-left:4px solid var(--gold)}.toast.err{border-color:var(--bad)}
.perm td{text-align:center}.perm td:first-child{text-align:left}.empty{padding:44px;text-align:center;color:var(--mut)}
.prog{height:8px;border-radius:8px;background:var(--sand);overflow:hidden}.prog i{display:block;height:100%;background:var(--ox)}
@media(max-width:1000px){.hero .g,.ai,.auth,.grid2,.ia{grid-template-columns:1fr}.feat,.strip{grid-template-columns:1fr}.feat div,.strip div{border-right:0!important;border-bottom:1px solid var(--line)!important}.lh nav{display:none}.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.side .off,.side .me,.side .logo{display:none}.side a.nv{white-space:nowrap}.main{padding:20px 16px 80px}.kpis{grid-template-columns:1fr 1fr}.gs{width:100%}.top{flex-direction:column}.auth .l{display:none}.auth .r{padding:30px 22px}.cal .d{min-height:70px}.r2{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=s=>s?new Date(s.length>10?s:s+'T12:00').toLocaleDateString('pt-BR'):'—';
const toast=(t,e)=>{const x=document.createElement('div');x.className='toast'+(e?' err':'');x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)};
async function api(m,u,b){try{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));return Array.isArray(j)?Object.assign(j,{_ok:r.ok,_s:r.status}):{ok:r.ok,status:r.status,...j}}catch(e){return{ok:false,error:'Sem conexão com o servidor.'}}}
let ME=null,OFFICE=null,CACHE={};
const logoSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M6 21h12M5 8h14M5 8l-3 7a3.500 3.500 0 0 0 6 0zM19 8l-3 7a3.500 3.500 0 0 0 6 0z"/></svg>';
const IC={painel:'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>',clientes:'<circle cx="9" cy="8" r="3.500"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0M17 4.500a3.500 3.500 0 0 1 0 7M18 14a6.500 6.500 0 0 1 3.500 6"/>',processos:'<path d="M4 4h12l4 4v12H4zM16 4v4h4M8 12h8M8 16h8"/>',prazos:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',documentos:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6"/>',ia:'<path d="M12 3l2.200 5.800L20 11l-5.800 2.200L12 19l-2.200-5.800L4 11l5.800-2.200z"/>',financeiro:'<path d="M3 7h18v12H3zM3 11h18M7 15h3"/>',comunicacao:'<path d="M21 12a8 8 0 0 1-11.500 7.200L4 20l1-4.500A8 8 0 1 1 21 12z"/>',equipe:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',assinatura:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>'};
const NAV=[['painel','Painel'],['clientes','Clientes'],['processos','Processos'],['prazos','Prazos e agenda'],['documentos','Documentos'],['ia','IA Jurídica'],['financeiro','Financeiro',['admin','financeiro']],['comunicacao','Comunicação'],['equipe','Equipe e segurança',['admin']],['assinatura','Assinatura',['admin']]];

/* ================= páginas públicas ================= */
const P={};
P.landing=()=>`<header class="lh"><div class="wrap"><a class="logo" href="#/">${logoSvg}Lexora<b>.</b></a><nav><a href="#recursos">Recursos</a><a href="#ia">Inteligência artificial</a><a href="#preco">Preço</a><a href="#faq">Dúvidas</a></nav><div class="row"><a class="btn o sm" href="#/entrar">Entrar</a><a class="btn ox sm" href="#/cadastro">Teste grátis</a></div></div></header>
<section class="hero"><div class="wrap g"><div><p class="up">Plataforma jurídica com inteligência artificial</p><h1>A rotina do escritório, <i>organizada.</i></h1><p class="l">Clientes, processos, prazos e documentos em um só lugar, com IA para resumir, extrair dados e preparar minutas. Você revisa, assina e protocola.</p><div class="row" style="gap:14px"><a class="btn ox" href="#/cadastro">Começar 30 dias grátis</a><a class="btn o" href="#preco">Ver preço</a></div><p class="sm mut" style="margin-top:16px">Sem taxa de adesão. Cartão apenas para continuar após o teste.</p></div>
<div class="mock"><div class="bar"><i></i><i></i><i></i></div><div class="in"><div class="k"><div><b>24</b><span>Processos</span></div><div><b style="color:var(--ox)">3</b><span>Prazos em 7 dias</span></div><div><b>R$ 18 mil</b><span>A receber</span></div></div><p class="up" style="margin:4px 0 6px">Próximos prazos</p>${[['Contestação — Marcos x Logística Rápida','2 dias','b'],['Audiência de conciliação — Prado x Seguradora','4 dias','w'],['Recurso ordinário — Castro x Banco Aurora','6 dias','']].map(([t,d,c])=>`<div class="ln"><span>${t}</span><span class="pill ${c}">${d}</span></div>`).join('')}</div></div></div></section>
<div class="strip"><div><b>Isolamento por escritório</b><span>Dados de cada escritório separados e protegidos.</span></div><div><b>Feito para a LGPD</b><span>Consentimento, exportação e anonimização do titular.</span></div><div><b>Revisão obrigatória</b><span>A IA propõe; o advogado decide e assina.</span></div><div><b>No navegador</b><span>Computador ou celular, sem instalar nada.</span></div></div>
<section class="s" id="recursos"><div class="wrap"><div class="sh"><p class="up">Recursos</p><h2>Tudo o que o escritório precisa <i>no dia a dia.</i></h2><p>Do cadastro do cliente ao recebimento dos honorários, sem planilhas espalhadas.</p></div><div class="feat">${[['Clientes e processos','Cadastro completo, partes, vara, fase e valor da causa. Tudo ligado ao cliente.'],['Prazos e tarefas','Calendário, alertas de prazos próximos e atrasados e responsáveis por tarefa.'],['Documentos','Armazenamento organizado, busca no conteúdo e modelos reutilizáveis.'],['Acompanhamento processual','Consulta de movimentações pela API pública do DataJud e registro manual.'],['Comunicação com clientes','Histórico de atendimento e mensagens prontas de atualização processual.'],['Financeiro','Honorários, pagamentos e despesas com relatórios de recebido e pendente.']].map(([t,d],i)=>`<div><span>0${i+1}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}</div></div></section>

/* ================= roteador ================= */
async function route(){const h=location.hash.replace(/^#\/?/,''),[path0,qs]=h.split('?'),parts=path0.split('/');
 if(ME===null){const r=await api('GET','/api/auth/me');ME=r.user||false;OFFICE=r.office||null}
 if(parts[0]==='app'){if(!ME){location.hash='#/entrar';return}const pg=parts[1]||'painel',id=parts[2];const f=A[pg]||A.painel;$('#root').innerHTML=await f(id,CACHE.ptab&&pg==='processo'?CACHE.ptab:undefined);bindApp();return}
 if(ME&&['entrar','cadastro',''].includes(parts[0])&&parts[0]!==''){location.hash='#/app/painel';return}
 const pg=({entrar:'entrar',cadastro:'cadastro',esqueci:'esqueci',redefinir:'redefinir'})[parts[0]]||'landing';$('#root').innerHTML=P[pg]();bindPublic(pg);window.scrollTo(0,0)}
function showErr(map){$$('.f').forEach(f=>f.classList.remove('bad'));Object.entries(map||{}).forEach(([k,m])=>{const f=$(`[data-k="${k}"]`);if(f){f.classList.add('bad');$('.er',f).textContent=m}})}
function bindPublic(pg){const f=$('#af');if(!f)return;f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));if(pg==='cadastro')b.aceite=!!f.aceite.checked;const btn=$('button.btn',f);btn.disabled=true;let r;
  if(pg==='entrar')r=await api('POST','/api/auth/login',b);else if(pg==='cadastro')r=await api('POST','/api/auth/register',b);else if(pg==='esqueci'){r=await api('POST','/api/auth/forgot',b);btn.disabled=false;if(r.ok){toast(r.msg);const o=await api('GET','/api/dev/outbox');if(o[0]&&$('#devm'))$('#devm').innerHTML=`<b>Ambiente de demonstração — e-mail simulado:</b><br><a href="#${o[0].link.replace('/#','')}" style="color:var(--ox)">abrir link de redefinição</a>`}return}
  else{r=await api('POST','/api/auth/reset',{token:new URLSearchParams(location.hash.split('?')[1]).get('token'),senha:b.senha});btn.disabled=false;if(r.ok){toast('Senha redefinida. Faça login.');location.hash='#/entrar'}else if(r.error)showErr({senha:r.error});return}
  btn.disabled=false;if(!r.ok){if(r.errors)showErr(r.errors);else showErr({[pg==='entrar'?'senha':'email']:r.error});return}ME=r.user;OFFICE=r.office;location.hash='#/app/painel'}}
function bindApp(){const on=(s,fn)=>{const e=$(s);if(e)e.onclick=fn};
 on('#out',async e=>{e.preventDefault();await api('POST','/api/auth/logout');ME=null;OFFICE=null;location.hash='#/'});
 $$('[data-go]').forEach(x=>x.onclick=()=>location.hash=x.dataset.go);
 const gs=$('#gs');if(gs){let t;gs.oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{const dd=$('#gsd');if(gs.value.length<2){dd.hidden=true;return}const r=await api('GET','/api/search?q='+encodeURIComponent(gs.value));dd.hidden=false;dd.innerHTML=r.length?r.map(x=>`<div data-to="${x.t==='cliente'?'cliente/'+x.id:x.t==='processo'?'processo/'+x.id:'ia?d='+x.id}"><span class="pill o" style="margin-right:8px">${x.t}</span><b style="font-weight:600">${esc(x.titulo)}</b><div class="sm mut">${esc(x.sub||'')}</div></div>`).join(''):'<div class="mut">Nada encontrado</div>';$$('[data-to]',dd).forEach(d=>d.onclick=()=>{dd.hidden=true;location.hash='#/app/'+d.dataset.to})},250)}}
 on('#new-client',()=>F2.client());on('#new-case',()=>F2.case());on('#new-task',()=>F2.task());on('#new-doc',()=>F2.doc());on('#new-fin',()=>F2.fin());on('#new-user',()=>F2.user());
 const cq=$('#cq');if(cq)cq.oninput=()=>{CACHE.cq=cq.value;clearTimeout(cq._t);cq._t=setTimeout(async()=>{const p=cq.selectionStart;await route();const n=$('#cq');n.focus();n.setSelectionRange(p,p)},200)};
 const dq=$('#dq');if(dq)dq.oninput=()=>{CACHE.dq=dq.value;clearTimeout(dq._t);dq._t=setTimeout(async()=>{const p=dq.selectionStart;await route();const n=$('#dq');n.focus();n.setSelectionRange(p,p)},200)};
 $$('[data-tab]').forEach(b=>b.onclick=async()=>{CACHE.ptab=b.dataset.tab;route()});
 $$('[data-pm]').forEach(b=>b.onclick=()=>{CACHE.pm=b.dataset.pm;route()});$$('[data-m]').forEach(b=>b.onclick=()=>{const r=CACHE.pref;CACHE.pref=new Date(r.getFullYear(),r.getMonth()+ +b.dataset.m,1);route()});
 $$('[data-done]').forEach(b=>b.onclick=async()=>{await api('PATCH','/api/tasks/'+b.dataset.done,{status:'concluida'});toast('Tarefa concluída');route()});
 $$('[data-pay]').forEach(b=>b.onclick=async()=>{await api('PATCH','/api/fin/'+b.dataset.pay,{pago:true});toast('Pagamento registrado');route()});
 $$('[data-mv]').forEach(b=>b.onclick=()=>F2.mv(b.dataset.mv));
 $$('[data-dj]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await api('POST',`/api/cases/${b.dataset.dj}/datajud`);b.disabled=false;if(r.configured===false)return toast(r.msg,true);if(r.error)return toast(r.error,true);toast(`${r.novos} nova(s) movimentação(ões) importada(s)`);route()});
 $$('[data-lgpd]').forEach(b=>b.onclick=async()=>{if(b.dataset.lgpd==='exp'){const r=await api('GET','/api/lgpd/export/'+b.dataset.id);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.download='dados-do-titular.json';a.click()}else if(confirm('Anonimizar este titular? Esta ação não pode ser desfeita.')){await api('POST','/api/lgpd/anonymize/'+b.dataset.id);toast('Titular anonimizado');route()}});
 $$('[data-role]').forEach(s=>s.onchange=async()=>{await api('PATCH','/api/team/'+s.dataset.role,{role:s.value});toast('Perfil atualizado')});
 $$('[data-iat]').forEach(b=>b.onclick=()=>{CACHE.iat=b.dataset.iat;route()});
 on('#ia-go',async()=>{const tab=CACHE.iat||(new URLSearchParams(location.hash.split('?')[1]||'').get('d')?'resumir':'minutar'),btn=$('#ia-go'),out=$('#ia-out');btn.disabled=true;out.innerHTML='<div class="out" style="color:var(--mut)">Processando…</div>';let r;
  if(tab==='minutar')r=await api('POST','/api/ai/draft',{template:$('#ia-tpl').value,processoId:$('#ia-case').value||undefined,instrucoes:$('#ia-ins').value});else{const body=$('#ia-doc').value?{docId:+$('#ia-doc').value}:{text:$('#ia-text').value};r=await api('POST',tab==='resumir'?'/api/ai/summarize':'/api/ai/extract',body)}
  btn.disabled=false;if(r.error){out.innerHTML=`<div class="out" style="color:var(--bad)">${esc(r.error)}</div>`;return}
  if(tab==='extrair')out.innerHTML=`<div class="card"><div class="h"><h3>${r.total} informações encontradas</h3><span class="pill o">${r.engine==='llm'?'LLM':'motor local'}</span></div><div class="b">${r.campos.map(c=>`<div class="fld"><b>${esc(c.tipo)}</b><div>${c.valores.map(v=>`<span class="v">${esc(v)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">Nada identificado.</div>'}</div></div>`;
  else if(tab==='resumir')out.innerHTML=`<div class="card"><div class="h"><h3>Resumo</h3><span class="pill">${r.palavras} palavras • −${r.reducao}%</span></div><div class="b"><div style="font-family:var(--serif);font-size:16px;line-height:1.7;white-space:pre-wrap">${esc(r.resumo)}</div><p class="up" style="margin:20px 0 8px">Palavras-chave</p>${r.palavrasChave.map(k=>`<span class="pill" style="margin:0 6px 6px 0">${esc(k)}</span>`).join('')}${r.pontosDeAtencao.length?`<p class="up" style="margin:18px 0 8px">Pontos de atenção</p>${r.pontosDeAtencao.map(p=>`<p class="sm" style="margin:0 0 8px;padding-left:12px;border-left:3px solid var(--gold)">${esc(p)}</p>`).join('')}`:''}</div></div>`;
  else{out.innerHTML=`<div class="row sp" style="margin-bottom:10px"><span class="pill o">${esc(r.modelo)}</span><span class="pill ${r.lacunas?'w':'ok'}">${r.lacunas} lacuna(s) a preencher</span></div><div class="out" id="draft">${esc(r.texto).replace(/\[PREENCHER[^\]]*\]/g,m=>`<mark style="background:#f6e6b4">${m}</mark>`)}</div><div class="row" style="margin-top:12px"><button class="btn o sm" id="dcopy">Copiar</button><button class="btn sm" id="dsave">Salvar como documento</button></div>`;
   on('#dcopy',()=>{navigator.clipboard&&navigator.clipboard.writeText(r.texto);toast('Texto copiado')});on('#dsave',async()=>{const x=await api('POST','/api/docs',{nome:r.modelo+' (rascunho IA)',texto:r.texto,tags:['IA','rascunho']});x.ok?toast('Salvo em Documentos'):toast(x.error,true)})}});
 const mc=$('#mc');if(mc){mc.onchange=()=>{CACHE.mc=mc.value;route()};$$('[data-msg]').forEach(b=>b.onclick=async()=>{const [cl,cs]=await Promise.all([api('GET','/api/clients'),api('GET','/api/cases')]);const c=cl.find(x=>x.id==mc.value);$('#mtext').value=MSGS[+b.dataset.msg][1](c.nome,cs.find(x=>x.clienteId==c.id))});on('#mcopy',()=>{navigator.clipboard&&navigator.clipboard.writeText($('#mtext').value);toast('Mensagem copiada')});on('#msend',async()=>{const t=$('#mtext').value;await api('POST','/api/msgs',{clienteId:+mc.value,canal:'whatsapp',texto:t,status:'preparada'});const cl=(await api('GET','/api/clients')).find(x=>x.id==mc.value);const ph=(cl.telefone||'').replace(/\D/g,'');window.open(`https://wa.me/${ph.length>=10?'55'+ph:''}?text=${encodeURIComponent(t)}`,'_blank');toast('Mensagem registrada no histórico');route()})}
 const cf=$('#cardf');if(cf)cf.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(cf));b.autoriza=!!cf.autoriza.checked;const r=await api('POST','/api/billing/card',b);if(!r.ok){if(r.errors)showErr(r.errors);else toast(r.error,true);return}toast(r.cobrancaImediata?'Pagamento aprovado. Assinatura ativa!':'Cartão cadastrado. A cobrança começa ao fim do teste.');OFFICE=(await api('GET','/api/auth/me')).office;route()};
 on('#cancel',async()=>{if(!confirm('Cancelar a assinatura? Você poderá reativar quando quiser.'))return;await api('POST','/api/billing/cancel');OFFICE=(await api('GET','/api/auth/me')).office;toast('Assinatura cancelada');route()});
}

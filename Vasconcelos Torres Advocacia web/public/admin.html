<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel — Vasconcelos Torres</title>
<style>
:root{--navy:#0f1b2d;--navy2:#1a2b45;--gold:#b8892d;--gold2:#d9b25a;--bg:#f4f1ea;--line:#e6dfd0;--mut:#5f6b7d;--ink:#1d2433;--ok:#1f7a4d;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:Georgia,serif;margin:0}
.side{position:fixed;left:0;top:0;bottom:0;width:236px;background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column}.side .lg{font-family:Georgia,serif;font-size:18px;line-height:1.2;padding:0 8px 24px;border-bottom:1px solid #263a58;margin-bottom:16px}.side .lg small{display:block;font-family:"Segoe UI",sans-serif;font-size:10px;letter-spacing:.2em;color:var(--gold2);text-transform:uppercase;margin-top:4px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:#b9c5d8;padding:12px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:4px}.side button.on{background:#1f3556;color:#fff}.side button i{margin-left:auto;font-style:normal;background:var(--gold);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.side .out{margin-top:auto;color:#8c9bb3}
main{margin-left:236px;padding:30px 34px;max-width:1240px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{font-size:30px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;border-top:3px solid var(--gold)}.kpi small{color:var(--mut);font-weight:600;font-size:13px}.kpi b{display:block;font-family:Georgia,serif;font-size:34px;margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}.panel .h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel .h h3{font-size:19px}
table{width:100%;border-collapse:collapse;font-size:14.5px}th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:12px 20px;background:#faf8f3}td{padding:14px 20px;border-top:1px solid var(--line);vertical-align:top}.sub{color:var(--mut);font-size:13px}
select,input,textarea{font:inherit;border:1.5px solid #d9d2c1;border-radius:6px;padding:9px 11px;background:#fff;outline:0;color:var(--ink)}select:focus,input:focus,textarea:focus{border-color:var(--gold)}
.tag{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:#ece7da;color:#5b5030}.tag.g{background:#e4f3ea;color:var(--ok)}.tag.b{background:#dde8f7;color:#1c4b8f}.tag.r{background:#fbe4e2;color:var(--bad)}
.btn{border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--gold);color:#fff}.btn.g{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.s{padding:6px 12px;font-size:13px}.btn.r{background:#fbe4e2;color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.case{padding:18px 20px;border-top:1px solid var(--line)}.case:first-child{border-top:0}.case .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.login{max-width:380px;margin:14vh auto;background:#fff;padding:34px;border-radius:10px;border-top:4px solid var(--gold);box-shadow:0 30px 60px -30px rgba(15,27,45,.4);text-align:center}.login input{width:100%;margin:16px 0 8px;padding:13px}
.form{padding:20px;display:grid;gap:12px}.form input,.form textarea,.form select{width:100%}.form textarea{min-height:200px}
.empty{padding:40px;text-align:center;color:var(--mut)}
@media(max-width:900px){.side{position:static;width:auto;flex-direction:row;overflow-x:auto;padding:12px}.side .lg{display:none}.side .out{margin:0}main{margin:0;padding:18px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}table,thead,tbody,tr,td{display:block}thead{display:none}td{border:0;padding:4px 18px}tr{border-top:1px solid var(--line);padding:10px 0}}
</style></head>
<body>
<div id="root"></div>
<script>
const $=(s)=>document.querySelector(s);let TK=sessionStorage.getItem('vt')||'',D=null,TAB='geral',EDIT=null;
const api=(p,o={})=>fetch('/api/admin'+p,{...o,headers:{Authorization:'Bearer '+TK,'Content-Type':'application/json'}});
const dt=(s)=>new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const dd=(s)=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function login(e){$('#root').innerHTML=`<div class="login"><h2>Área restrita</h2><p style="color:var(--mut);margin:6px 0 0">Informe o token de acesso.</p><input id="tk" type="password" placeholder="Token" autofocus><div style="color:var(--bad);font-size:13px;min-height:20px">${e||''}</div><button class="btn" style="width:100%" id="lg">Entrar</button></div>`;$('#lg').onclick=go;$('#tk').onkeydown=x=>{if(x.key==='Enter')go()}}
async function go(){if($('#tk'))TK=$('#tk').value;const r=await api('/overview');if(r.status===401){sessionStorage.removeItem('vt');return login('Token inválido.')}sessionStorage.setItem('vt',TK);D=await r.json();draw()}
const today=()=>new Date().toISOString().slice(0,10);
function draw(){const ap=D.appointments,cs=D.cases,ps=D.posts;const novos=cs.filter(c=>c.status==='Recebido').length,hoje=ap.filter(a=>a.date===today()&&a.status!=='cancelado').length,fut=ap.filter(a=>a.date>=today()&&a.status!=='cancelado').length;
 const nav=[['geral','Visão geral'],['agenda','Agenda',fut],['casos','Casos',novos],['artigos','Artigos']];
 $('#root').innerHTML=`<aside class="side"><div class="lg">Vasconcelos Torres<small>Painel do escritório</small></div>${nav.map(([k,l,n])=>`<button class="${TAB===k?'on':''}" data-t="${k}">${l}${n?`<i>${n}</i>`:''}</button>`).join('')}<button class="out" id="out">Sair</button></aside><main id="mn"></main>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;EDIT=null;draw()});$('#out').onclick=()=>{sessionStorage.removeItem('vt');TK='';login()};
 const m=$('#mn');
 if(TAB==='geral'){const up=ap.filter(a=>a.date>=today()&&a.status!=='cancelado').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);const by={};cs.forEach(c=>by[c.status]=(by[c.status]||0)+1);
  m.innerHTML=`<div class="top"><h1>Visão geral</h1><span class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</span></div><div class="kpis"><div class="kpi"><small>Consultas hoje</small><b>${hoje}</b></div><div class="kpi"><small>Próximas consultas</small><b>${fut}</b></div><div class="kpi"><small>Casos novos</small><b>${novos}</b></div><div class="kpi"><small>Casos contratados</small><b>${by['Contratado']||0}</b></div></div>
  <div class="grid"><div class="panel"><div class="h"><h3>Próximas consultas</h3></div>${up.map(a=>`<div class="case"><div class="row"><div><b>${esc(a.name)}</b><div class="sub">${esc(a.subject)} • ${a.mode}</div></div><div style="text-align:right"><b>${dd(a.date)}</b><div class="sub">${a.time}</div></div></div></div>`).join('')||'<div class="empty">Sem consultas agendadas.</div>'}</div>
  <div class="panel"><div class="h"><h3>Casos por etapa</h3></div><div style="padding:18px 20px">${D.statuses.map(s=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600"><span>${s}</span><span>${by[s]||0}</span></div><div style="height:8px;border-radius:8px;background:#efe9db;margin-top:5px"><div style="height:100%;width:${cs.length?(by[s]||0)/cs.length*100:0}%;background:var(--gold);border-radius:8px"></div></div></div>`).join('')}</div></div></div>`}
 if(TAB==='agenda'){const sorted=ap.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  m.innerHTML=`<div class="top"><h1>Agenda de consultas</h1></div><div class="panel"><table><thead><tr><th>Data</th><th>Cliente</th><th>Assunto</th><th>Formato</th><th>Status</th></tr></thead><tbody>${sorted.map(a=>`<tr><td><b>${dd(a.date)}</b><div class="sub">${a.time}</div></td><td><b>${esc(a.name)}</b><div class="sub">${esc(a.phone)} • ${esc(a.email)}</div></td><td>${esc(a.subject)}</td><td><span class="tag ${a.mode==='online'?'b':''}">${a.mode}</span></td><td><select data-ap="${a.id}">${['agendado','confirmado','realizado','cancelado','faltou'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=5 class="empty">Nenhuma consulta.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('[data-ap]').forEach(s=>s.onchange=async()=>{const r=await api('/appointments/'+s.dataset.ap,{method:'PATCH',body:JSON.stringify({status:s.value})});Object.assign(D.appointments.find(x=>x.id===s.dataset.ap),await r.json());draw()})}
 if(TAB==='casos'){m.innerHTML=`<div class="top"><h1>Casos recebidos</h1></div><div class="panel">${cs.map(c=>`<div class="case"><div class="row"><div style="flex:1"><b style="font-size:17px">${esc(c.name)}</b> <span class="tag">${c.id}</span> <span class="tag ${c.status==='Contratado'?'g':c.status==='Recebido'?'b':''}">${c.status}</span><div class="sub">${esc(c.area)} • ${esc(c.end)}${c.employer?' • '+esc(c.employer):''} • ${dt(c.createdAt)}</div><p style="margin:10px 0;font-size:15px">${esc(c.story)}</p><div class="sub">${esc(c.phone)} • ${esc(c.email)}</div></div><div style="width:230px"><select data-cs="${c.id}" style="width:100%">${D.statuses.map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><input data-note="${c.id}" placeholder="Mensagem ao cliente (opcional)" style="width:100%;margin-top:8px"><textarea data-int="${c.id}" placeholder="Anotação interna" style="width:100%;margin-top:8px;min-height:56px">${esc(c.notes)}</textarea></div></div></div>`).join('')||'<div class="empty">Nenhum caso recebido.</div>'}</div>`;
  document.querySelectorAll('[data-cs]').forEach(s=>s.onchange=async()=>{const n=document.querySelector(`[data-note="${s.dataset.cs}"]`).value;const r=await api('/cases/'+s.dataset.cs,{method:'PATCH',body:JSON.stringify({status:s.value,note:n})});Object.assign(D.cases.find(x=>x.id===s.dataset.cs),await r.json());draw()});
  document.querySelectorAll('[data-int]').forEach(t=>t.onchange=async()=>{await api('/cases/'+t.dataset.int,{method:'PATCH',body:JSON.stringify({notes:t.value})})})}
 if(TAB==='artigos'){if(EDIT!==null){const p=EDIT===0?{title:'',excerpt:'',category:'Direito do Trabalho',body:''}:ps.find(x=>x.slug===EDIT);
   m.innerHTML=`<div class="top"><h1>${EDIT===0?'Novo artigo':'Editar artigo'}</h1><button class="btn g" id="cx">Voltar</button></div><div class="panel"><div class="form"><input id="a-t" placeholder="Título" value="${esc(p.title)}"><input id="a-c" placeholder="Categoria" value="${esc(p.category)}"><input id="a-e" placeholder="Resumo (aparece na listagem)" value="${esc(p.excerpt)}"><textarea id="a-b" placeholder="Texto. Use ## para subtítulos e - para listas.">${esc(p.body)}</textarea><div><button class="btn" id="a-s">Publicar</button> <button class="btn g" id="a-d">Salvar como rascunho</button></div></div></div>`;
   $('#cx').onclick=()=>{EDIT=null;draw()};const sv=async pub=>{const b={title:$('#a-t').value,category:$('#a-c').value,excerpt:$('#a-e').value,body:$('#a-b').value,published:pub};const r=EDIT===0?await api('/posts',{method:'POST',body:JSON.stringify(b)}):await api('/posts/'+EDIT,{method:'PATCH',body:JSON.stringify(b)});if(!r.ok){alert((await r.json()).error||'Erro ao salvar');return}await go();EDIT=null;draw()};$('#a-s').onclick=()=>sv(true);$('#a-d').onclick=()=>sv(false)}
  else{m.innerHTML=`<div class="top"><h1>Artigos do blog</h1><button class="btn" id="nw">+ Novo artigo</button></div><div class="panel"><table><thead><tr><th>Título</th><th>Categoria</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody>${ps.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td><b>${esc(p.title)}</b><div class="sub">/artigos?a=${p.slug}</div></td><td>${esc(p.category)}</td><td>${dd(p.date)}</td><td><span class="tag ${p.published?'g':''}">${p.published?'Publicado':'Rascunho'}</span></td><td style="white-space:nowrap"><button class="btn g s" data-ed="${p.slug}">Editar</button> <button class="btn g s" data-tg="${p.slug}">${p.published?'Despublicar':'Publicar'}</button> <button class="btn r s" data-rm="${p.slug}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;
   $('#nw').onclick=()=>{EDIT=0;draw()};document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{EDIT=b.dataset.ed;draw()});
   document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const p=ps.find(x=>x.slug===b.dataset.tg);await api('/posts/'+p.slug,{method:'PATCH',body:JSON.stringify({published:!p.published})});await go()});
   document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir este artigo?')){await api('/posts/'+b.dataset.rm,{method:'DELETE'});await go()}})}}}
TK?go():login();
</script></body></html>

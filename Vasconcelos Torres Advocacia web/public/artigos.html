<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artigos — Vasconcelos Torres Advocacia Trabalhista</title>
<style>
:root{--navy:#0f1b2d;--navy2:#1a2b45;--gold:#b8892d;--gold2:#d9b25a;--ivory:#fbf8f2;--ink:#1d2433;--mut:#5f6b7d;--line:#e6dfd0}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);background:var(--ivory);line-height:1.7}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}a{color:inherit}.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header{background:var(--navy);color:#fff}.nav{display:flex;align-items:center;justify-content:space-between;height:76px}.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}.logo b{font-family:Georgia,serif;font-size:19px;display:block;line-height:1.1}.logo small{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);display:block}
.nav a.b{background:var(--gold);color:#fff;padding:11px 20px;border-radius:4px;text-decoration:none;font-weight:700;font-size:14px}
.top{background:linear-gradient(115deg,var(--navy),var(--navy2));color:#fff;padding:60px 0 52px}.top h1{font-size:clamp(32px,4.5vw,50px)}.top p{color:#b8c3d4;font-size:18px;margin:12px 0 0;max-width:600px}
.tools{display:flex;gap:14px;flex-wrap:wrap;margin:34px 0 28px;align-items:center}.tools input{flex:1;min-width:220px;padding:13px 16px;border:1.5px solid #d9d2c1;border-radius:4px;font:inherit;outline:0}.tools input:focus{border-color:var(--gold)}
.chip{padding:9px 16px;border:1.5px solid #d9d2c1;border-radius:99px;background:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--mut)}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:80px}.post{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:.25s}.post:hover{transform:translateY(-4px);box-shadow:0 24px 40px -26px rgba(15,27,45,.45)}
.post .im{height:130px;background:linear-gradient(135deg,var(--navy),#294468);padding:20px;display:flex;align-items:flex-end}.post .im span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:700}.post .tx{padding:22px}.post h3{font-size:19px;margin-bottom:10px}.post p{margin:0;color:var(--mut);font-size:14.5px;line-height:1.55}.post small{display:block;margin-top:14px;color:#8c95a5;font-size:13px}
article{max-width:760px;margin:0 auto;padding:54px 24px 80px}article .meta{color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px}article h1{font-size:clamp(30px,4.5vw,46px);margin:12px 0 14px}article .by{color:var(--mut);font-size:15px;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:30px}
article h2{font-size:26px;margin:36px 0 12px}article p,article li{font-size:18px;color:#2b3447}article ul,article ol{padding-left:24px}article li{margin-bottom:6px}
.cta{background:var(--navy);color:#fff;border-radius:6px;padding:32px;margin-top:44px;border-top:4px solid var(--gold)}.cta h3{font-size:24px;margin-bottom:8px}.cta p{color:#b8c3d4;margin:0 0 18px;font-size:16px}.cta a{display:inline-block;background:var(--gold);color:#fff;padding:14px 26px;border-radius:4px;text-decoration:none;font-weight:700}
.note{font-size:13px;color:var(--mut);margin-top:26px;line-height:1.6}.back{display:inline-block;margin-bottom:20px;color:var(--mut);text-decoration:none;font-weight:600}
@media(max-width:900px){.posts{grid-template-columns:1fr 1fr}}@media(max-width:600px){.posts{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap nav"><a class="logo" href="/"><svg width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#d9b25a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v34M14 40h20M8 15h32M8 15l-5 13a5.5 5.5 0 0 0 10 0zM40 15l-5 13a5.5 5.5 0 0 0 10 0z"/><circle cx="24" cy="9" r="2"/></svg><span><b>Vasconcelos Torres</b><small>Advocacia Trabalhista</small></span></a><a class="b" href="/#agendar">Agendar consulta</a></div></header>
<div id="app"></div>
<script>
const $=(s)=>document.querySelector(s);const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){const L=t.split('\n');let h='',list=null;const close=()=>{if(list){h+=`</${list}>`;list=null}};
 for(const l of L){if(/^## /.test(l)){close();h+=`<h2>${esc(l.slice(3))}</h2>`}else if(/^- /.test(l)){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${esc(l.slice(2))}</li>`}else if(/^\d+\. /.test(l)){if(list!=='ol'){close();h+='<ol>';list='ol'}h+=`<li>${esc(l.replace(/^\d+\. /,''))}</li>`}else if(l.trim()===''){close()}else{close();h+=`<p>${esc(l)}</p>`}}close();return h}
async function list(){const ps=await (await fetch('/api/posts')).json();const cats=['Todos',...new Set(ps.map(p=>p.category))];let c='Todos',q='';
 $('#app').innerHTML=`<div class="top"><div class="wrap"><h1>Artigos e orientações</h1><p>Conteúdo jurídico em linguagem simples para você conhecer e defender seus direitos.</p></div></div><div class="wrap"><div class="tools"><input id="q" placeholder="Buscar artigo…"><div id="cats" style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div class="posts" id="g"></div></div>`;
 const draw=()=>{$('#cats').innerHTML=cats.map(x=>`<button class="chip ${x===c?'on':''}" data-c="${x}">${x}</button>`).join('');const f=ps.filter(p=>(c==='Todos'||p.category===c)&&(!q||(p.title+p.excerpt).toLowerCase().includes(q)));
  $('#g').innerHTML=f.map(p=>`<a class="post" href="?a=${p.slug}"><div class="im"><span>${p.category}</span></div><div class="tx"><h3 class="serif">${p.title}</h3><p>${p.excerpt}</p><small>${fmt(p.date)} • ${p.readMin} min de leitura</small></div></a>`).join('')||'<p>Nenhum artigo encontrado.</p>'};
 draw();$('#cats').onclick=e=>{const b=e.target.closest('[data-c]');if(b){c=b.dataset.c;draw()}};$('#q').oninput=e=>{q=e.target.value.toLowerCase();draw()}}
async function one(slug){const r=await fetch('/api/posts/'+slug);if(!r.ok){$('#app').innerHTML='<article><h1>Artigo não encontrado</h1><p><a href="/artigos">Ver todos os artigos</a></p></article>';return}const p=await r.json();document.title=p.title+' — Vasconcelos Torres';
 $('#app').innerHTML=`<article><a class="back" href="/artigos">← Todos os artigos</a><div class="meta">${p.category}</div><h1>${p.title}</h1><div class="by">Por ${p.author} • ${fmt(p.date)} • ${p.readMin} min de leitura</div>${md(p.body)}<div class="cta"><h3>Seu caso é parecido?</h3><p>Cada situação tem particularidades. Converse com um advogado trabalhista e entenda seus direitos.</p><a href="/#agendar">Agendar consulta</a></div><p class="note">Este artigo tem caráter informativo e não substitui a análise individual do seu caso por um advogado.</p></article>`;scrollTo(0,0)}
const a=new URLSearchParams(location.search).get('a');a?one(a):list();
</script></body></html>
